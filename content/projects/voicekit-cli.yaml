    import argparse
    import json
    import sys
    from collections import Counter
    from voicelab import fake_kubectl, load_cdrs

    def build_parser():
        parser = argparse.ArgumentParser(prog="voicekit")
        sub = parser.add_subparsers(dest="command",
                                    required=True)
        report = sub.add_parser("report", help="ASR per trunk")
        report.add_argument("--format", default="table",
                            choices=["table", "json"])
        check = sub.add_parser("check", help="pod health")
        check.add_argument("--max-restarts", type=int,
                           default=3)
        return parser

    print(build_parser().parse_args(["check"]))
  tests: |
    p = build_parser()
    check(lambda: p.parse_args(["report"]).format == "table", "report --format defaults to table")
    check(lambda: p.parse_args(["report", "--format", "json"]).format == "json", "report --format json works")
    check(lambda: p.parse_args(["check", "--max-restarts", "5"]).max_restarts == 5, "check --max-restarts 5 gives the int 5")
    try:
        p.parse_args([])
        code = None
    except SystemExit as e:
        code = e.code
    check(lambda: code == 2, "no subcommand is an error (exit code 2)")
  hint: sub = parser.add_subparsers(dest="command", required=True). Then report = sub.add_parser("report") with add_argument("--format", choices=[...], default="table"), and the same for check.
  explain: Subcommands keep one tool for related jobs, like git or kubectl. Each gets only the options it needs.
