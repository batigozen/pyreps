    import argparse
    import json
    import sys
    from collections import Counter
    from voicelab import fake_kubectl, load_cdrs

    def build_parser():
        parser = argparse.ArgumentParser(prog="voicekit")
        sub = parser.add_subparsers(dest="command",
                                    required=True)
        report = sub.add_parser("report", help="ASR per trunk")
        report.add_argument("--format", default="table",
                            choices=["table", "json"])
        check = sub.add_parser("check", help="pod health")
        check.add_argument("--max-restarts", type=int,
                           default=3)
        return parser

    def asr_per_trunk(rows):
        calls, ok = Counter(), Counter()
        for row in rows:
            calls[row["trunk"]] += 1
            ok[row["trunk"]] += row["sip_code"] == "200"
        return {t: round(ok[t] / n, 3)
                for t, n in calls.items()}

    def cmd_report(args):
        asr = asr_per_trunk(load_cdrs())
        if args.format == "json":
            print(json.dumps(asr, sort_keys=True))
        else:
            for trunk in sorted(asr):
                print(f"{trunk:<14}{asr[trunk]:>7.1%}")
        return 0

    cmd_report(build_parser().parse_args(["report"]))
  tests: |
    import io, contextlib
    def run(argv):
        out = io.StringIO()
        with contextlib.redirect_stdout(out):
            code = cmd_report(build_parser().parse_args(argv))
        return code, out.getvalue().splitlines()
    code, lines = run(["report"])
    check(lambda: code == 0, "cmd_report returns 0")
    check(lambda: lines == ["biz-trunk-07    81.2%", "ic-ams-01       58.8%", "ic-rtd-02       40.0%"], "the table: one aligned line per trunk, sorted")
    import json as _json
    check(lambda: _json.loads(run(["report", "--format", "json"])[1][0]) == {"biz-trunk-07": 0.812, "ic-ams-01": 0.588, "ic-rtd-02": 0.4}, "--format json prints the ASRs as JSON")
  hint: asr = asr_per_trunk(load_cdrs()). If args.format == "json", print json.dumps(asr, sort_keys=True). Otherwise loop over sorted(asr) and print f"{trunk:<14}{asr[trunk]:>7.1%}".
  explain: Each subcommand is a function that takes args and returns an exit code. That makes every command easy to test on its own.
