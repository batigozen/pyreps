  solution: |
    import argparse
    import json
    import sys
    from collections import Counter
    from voicelab import fake_kubectl, load_cdrs

    def build_parser():
        parser = argparse.ArgumentParser(prog="voicekit")
        sub = parser.add_subparsers(dest="command",
                                    required=True)
        report = sub.add_parser("report", help="ASR per trunk")
        report.add_argument("--format", default="table",
                            choices=["table", "json"])
        check = sub.add_parser("check", help="pod health")
        check.add_argument("--max-restarts", type=int,
                           default=3)
        return parser

    def asr_per_trunk(rows):
        calls, ok = Counter(), Counter()
        for row in rows:
            calls[row["trunk"]] += 1
            ok[row["trunk"]] += row["sip_code"] == "200"
        return {t: round(ok[t] / n, 3)
                for t, n in calls.items()}

    def cmd_report(args):
        asr = asr_per_trunk(load_cdrs())
        if args.format == "json":
            print(json.dumps(asr, sort_keys=True))
        else:
            for trunk in sorted(asr):
                print(f"{trunk:<14}{asr[trunk]:>7.1%}")
        return 0

    def pod_problems(max_restarts):
        """Yield (pod name, problem) for every problem found."""
        for pod in json.loads(fake_kubectl())["items"]:
            name = pod["metadata"]["name"]
            status = pod["status"]
            statuses = status.get("containerStatuses", [])
            ready = [c["ready"] for c in statuses]
            if status["phase"] != "Running":
                yield name, "not running"
            if not (ready and all(ready)):
                yield name, "not ready"
            restarts = sum(c["restartCount"] for c in statuses)
            if restarts >= max_restarts:
                yield name, f"restarts {restarts}"

    def cmd_check(args):
        found = list(pod_problems(args.max_restarts))
        for name, problem in found:
            print(f"{name}: {problem}")
        down = {"not running", "not ready"}
        if any(problem in down for _, problem in found):
            return 2
        return 1 if found else 0


    COMMANDS = {"report": cmd_report, "check": cmd_check}


    def main(argv=None):
        args = build_parser().parse_args(argv)
        return COMMANDS[args.command](args)

    if __name__ == "__main__":
        # In the app there are no arguments, so run "check".
        argv = sys.argv[1:] or ["check"]
        print("exit code", main(argv))
  tests: |
    import io, contextlib
    def run(argv):
        out = io.StringIO()
        with contextlib.redirect_stdout(out):
            code = main(argv)
        return code, out.getvalue()
    code, text = run(["check"])
    check(lambda: code == 2, "main(['check']) returns 2: two pods are down or not ready")
    check(lambda: "cdr-exporter-g62q9xtk4r-bjmw2: not ready" in text, "the problems are printed, like 'cdr-exporter-...: not ready'")
    check(lambda: run(["report"])[0] == 0, "main(['report']) returns 0")
    check(lambda: "restarts 1" in run(["check", "--max-restarts", "1"])[1], "--max-restarts 1 also reports call-api's restart")
  hint: 'cmd_check: found = list(pod_problems(args.max_restarts)), print each, return 2 if a problem is "not running" or "not ready", else 1 if found, else 0. main: args = build_parser().parse_args(argv), then call the function for args.command from a dict.'
  explain: 'A dict from command name to function is a dispatch table: main stays two lines however many commands you add. In a-Shell: python3 voicekit-cli.py report --format json.'
