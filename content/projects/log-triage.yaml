  solution: |
    import hashlib
    import re
    from collections import Counter
    from pathlib import Path
    from voicelab import read_log

    PHONE = re.compile(r"\+31\d{7}(\d{2})")


    def mask(line):
        return PHONE.sub(r"+31*******\1", line)

    def per_sbc(lines):
        return Counter(line.split()[2] for line in lines
                       if len(line.split()) > 2)

    def fingerprint(line):
        return hashlib.sha256(line.encode()).hexdigest()[:16]


    def new_lines(old, new):
        seen = {fingerprint(line) for line in old}
        return [mask(line) for line in new
                if fingerprint(line) not in seen]

    yesterday = Path("project/sip-yesterday.log").read_text()
    for line in new_lines(yesterday.splitlines(), read_log()):
        print(line[:60])
  tests: |
    import hashlib as _h
    old = Path("project/sip-yesterday.log").read_text().splitlines()
    found = new_lines(old, read_log())
    check(lambda: fingerprint("x") == _h.sha256(b"x").hexdigest()[:16], "fingerprint is the first 16 hex characters of sha256")
    check(lambda: len(found) == 2, "2 lines are new today: the 503 on c1004 and the cut-off line")
    check(lambda: "c1004@ic" in found[0] and "+31*******10" in found[0], "the new lines are masked")
    check(lambda: new_lines(old, old) == [], "comparing a log with itself finds nothing")
  hint: seen = {fingerprint(line) for line in old}, a set for fast lookups. Then keep mask(line) for each line in new whose fingerprint is not in seen.
  explain: 'Hashing lines lets you compare logs without keeping both in full, and the hashes are safe to store because they hide the content. Yesterday''s log is a project file: see the second tab.'
