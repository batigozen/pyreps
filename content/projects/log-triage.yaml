steps:
- id: triage-1-mask
  level: 2
  prompt: Mask every +31 number in a line, keeping only the last 2 digits.
  starter: |
    import hashlib
    import re
    from collections import Counter
    from pathlib import Path
    from voicelab import read_log

    def mask(line):
        """Hide +31 numbers but keep the last 2 digits."""
        return line

    print(mask(read_log()[0]))
  solution: |
    import hashlib
    import re
    from collections import Counter
    from pathlib import Path
    from voicelab import read_log

    PHONE = re.compile(r"\+31\d{7}(\d{2})")


    def mask(line):
        return PHONE.sub(r"+31*******\1", line)

    print(mask(read_log()[0]))
  tests: |
    line = read_log()[0]
    check(lambda: "+31639958838" not in mask(line), "the caller number is hidden")
    check(lambda: "from=+31*******38 to=+31*******83" in mask(line), "it keeps the last 2 digits: +31*******38")
    check(lambda: mask("no numbers here") == "no numbers here", "a line without numbers stays the same")
  hint: 'A regex with one group for the last 2 digits: r"\+31\d{7}(\d{2})". re.sub(pattern, r"+31*******\1", line) puts the group back with \1.'
  explain: Mask phone numbers before a log leaves the system, for example into a ticket or a chat. That's both privacy law and good practice.
- id: triage-2-per-sbc
  level: 2
  prompt: Count the log lines per SBC with a Counter.
  starter: |
    import hashlib
    import re
    from collections import Counter
    from pathlib import Path
    from voicelab import read_log

    PHONE = re.compile(r"\+31\d{7}(\d{2})")


    def mask(line):
        return PHONE.sub(r"+31*******\1", line)

    def per_sbc(lines):
        """Counter of lines per SBC (the 3rd field)."""
        return Counter()

    print(per_sbc(read_log()).most_common())
  solution: |
    import hashlib
    import re
    from collections import Counter
    from pathlib import Path
    from voicelab import read_log

    PHONE = re.compile(r"\+31\d{7}(\d{2})")


    def mask(line):
        return PHONE.sub(r"+31*******\1", line)

    def per_sbc(lines):
        return Counter(line.split()[2] for line in lines
                       if len(line.split()) > 2)

    print(per_sbc(read_log()).most_common())
  tests: |
    c = per_sbc(read_log())
    check(lambda: c == Counter({"sbc-ic-01": 7, "sbc-biz-01": 6, "sbc-ic-02": 5}), "sbc-ic-01: 7, sbc-biz-01: 6, sbc-ic-02: 5")
    check(lambda: isinstance(c, Counter), "return a Counter")
    check(lambda: per_sbc(["short line"]) == Counter(), "lines with fewer than 3 fields are skipped")
  hint: 'line.split() gives the fields: time, level, SBC, ... Count fields[2] with Counter(... for line in lines if len(line.split()) > 2).'
  explain: 'Counting per source is the first step of every triage: which SBC is noisy? most_common() sorts the answer for you.'
