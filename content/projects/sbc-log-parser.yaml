  solution: |
    import re
    from voicelab import read_log

    LINE = re.compile(
        r"^(?P<ts>\S+) (?P<level>\w+)\s+(?P<sbc>\S+) "
        r"INVITE call-id=(?P<call_id>\S+) "
        r"from=(?P<caller>\S+) to=(?P<callee>\S+) "
        r"-> (?P<code>\d{3}) (?P<reason>.+?) "
        r"setup_ms=(?P<setup_ms>\d+)$"
    )

    def parse_line(line):
        m = LINE.match(line)
        if m is None:
            return None
        d = m.groupdict()
        d["code"] = int(d["code"])
        d["setup_ms"] = int(d["setup_ms"])
        return d

    def avg_setup(lines):
        times = {}
        for line in lines:
            entry = parse_line(line)
            if entry is None:
                continue
            ms = times.setdefault(entry["sbc"], [])
            ms.append(entry["setup_ms"])
        return {sbc: round(sum(ms) / len(ms), 1)
                for sbc, ms in times.items()}

    def slowest(lines, n=3):
        entries = [e for e in map(parse_line, lines) if e]
        entries.sort(key=lambda e: e["setup_ms"], reverse=True)
        return entries[:n]


    def table(entries):
        rows = [f"{'call':<10}{'sbc':<12}{'code':>4}{'ms':>7}"]
        for e in entries:
            rows.append(f"{e['call_id']:<10}{e['sbc']:<12}"
                        f"{e['code']:>4}{e['setup_ms']:>7}")
        return rows

    for row in table(slowest(read_log())):
        print(row)
  tests: |
    top = slowest(read_log())
    check(lambda: [e["call_id"] for e in top] == ["c1004@ic", "c1013@ic", "c1014@ic"], "the 3 slowest are c1004, c1013 and c1014")
    check(lambda: len(slowest(read_log(), 5)) == 5, "n=5 gives 5 entries")
    rows = table(top)
    check(lambda: rows[0] == "call      sbc         code     ms", "the header row: call, sbc, code, ms")
    check(lambda: rows[1] == "c1004@ic  sbc-ic-02    503   3087", "rows use the same widths as the header")
  hint: 'Sort the parsed entries with key=lambda e: e["setup_ms"], reverse=True, and slice [:n]. In table, use the widths <10, <12, >4, >7 for both the header and the rows.'
  explain: 'The two slowest calls both failed (503, 500) on sbc-ic-02: slow setup and errors often go together. That''s a lead to check on the SBC.'
