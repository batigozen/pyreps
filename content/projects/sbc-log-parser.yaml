    import re
    from voicelab import read_log

    LINE = re.compile(
        r"^(?P<ts>\S+) (?P<level>\w+)\s+(?P<sbc>\S+) "
        r"INVITE call-id=(?P<call_id>\S+) "
        r"from=(?P<caller>\S+) to=(?P<callee>\S+) "
        r"-> (?P<code>\d{3}) (?P<reason>.+?) "
        r"setup_ms=(?P<setup_ms>\d+)$"
    )

    def parse_line(line):
        m = LINE.match(line)
        if m is None:
            return None
        d = m.groupdict()
        d["code"] = int(d["code"])
        d["setup_ms"] = int(d["setup_ms"])
        return d

    def avg_setup(lines):
        times = {}
        for line in lines:
            entry = parse_line(line)
            if entry is None:
                continue
            ms = times.setdefault(entry["sbc"], [])
            ms.append(entry["setup_ms"])
        return {sbc: round(sum(ms) / len(ms), 1)
                for sbc, ms in times.items()}

    print(avg_setup(read_log()))
  tests: |
    avg = avg_setup(read_log())
    check(lambda: avg == {"sbc-biz-01": 364.3, "sbc-ic-02": 1786.2, "sbc-ic-01": 471.2}, "averages per SBC, rounded to 1 decimal")
    check(lambda: avg_setup([]) == {}, "no lines gives {}")
    check(lambda: avg_setup(["2026-10-21T09:06:36.500Z INFO  sbc-ic-01 OPTIONS keepalive ok"]) == {}, "lines that don't parse are skipped")
  hint: 'Use parse_line on every line and skip None. Collect setup_ms per SBC with setdefault(sbc, []).append(ms), then build {sbc: round(sum / len, 1)}.'
  explain: sbc-ic-02 averages 1786 ms because two calls took over 3 seconds (a 503 and a 500). An average hides that; the next step shows the slowest calls themselves.
