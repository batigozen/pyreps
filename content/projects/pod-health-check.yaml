    import json
    from voicelab import fake_kubectl

    def load_pods(text):
        pods = []
        for item in json.loads(text)["items"]:
            status = item["status"]
            statuses = status.get("containerStatuses", [])
            ready = [c["ready"] for c in statuses]
            restarts = sum(c["restartCount"] for c in statuses)
            pods.append({
                "name": item["metadata"]["name"],
                "phase": status["phase"],
                "ready": bool(ready) and all(ready),
                "restarts": restarts,
            })
        return pods

    def problems(pod, max_restarts=3):
        found = []
        if pod["phase"] != "Running":
            found.append("not running")
        if not pod["ready"]:
            found.append("not ready")
        if pod["restarts"] >= max_restarts:
            found.append(f"restarts {pod['restarts']}")
        return found

    for pod in load_pods(fake_kubectl()):
        print(pod["name"], problems(pod))
  tests: |
    by = {p["name"]: p for p in load_pods(fake_kubectl())}
    check(lambda: problems(by["cdr-exporter-g62q9xtk4r-bjmw2"]) == ["not ready", "restarts 6"], "cdr-exporter: not ready, restarts 6")
    check(lambda: problems(by["kpi-collector-5d8f7c9b4f-2xvkp"]) == ["not running", "not ready"], "kpi-collector: not running, not ready")
    check(lambda: problems(by["call-api-6d4b8f7c9a-m2xqp"]) == [], "call-api (1 restart) is healthy")
    check(lambda: problems(by["call-api-6d4b8f7c9a-m2xqp"], max_restarts=1) == ["restarts 1"], "with max_restarts=1, call-api's restart counts")
  hint: Start with found = []. Add "not running" when phase != "Running", "not ready" when not ready, and f"restarts {n}" when restarts >= max_restarts.
  explain: Returning a list of reasons, not just True or False, tells the on-call engineer what to look at first.
