  solution: |
    import json
    from voicelab import fake_kubectl

    def load_pods(text):
        pods = []
        for item in json.loads(text)["items"]:
            status = item["status"]
            statuses = status.get("containerStatuses", [])
            ready = [c["ready"] for c in statuses]
            restarts = sum(c["restartCount"] for c in statuses)
            pods.append({
                "name": item["metadata"]["name"],
                "phase": status["phase"],
                "ready": bool(ready) and all(ready),
                "restarts": restarts,
            })
        return pods

    for pod in load_pods(fake_kubectl()):
        print(pod)
  tests: |
    pods = load_pods(fake_kubectl())
    by = {p["name"]: p for p in pods}
    check(lambda: len(pods) == 5, "there are 5 pods")
    check(lambda: by["cdr-exporter-g62q9xtk4r-bjmw2"] == {"name": "cdr-exporter-g62q9xtk4r-bjmw2", "phase": "Running", "ready": False, "restarts": 6}, "cdr-exporter: Running, not ready, 6 restarts")
    check(lambda: by["kpi-collector-5d8f7c9b4f-2xvkp"]["ready"] is False, "a Pending pod with no containers is not ready")
    check(lambda: by["call-api-6d4b8f7c9a-m2xqp"]["ready"] is True, "call-api is ready")
  hint: 'Loop over json.loads(text)["items"]. containerStatuses may be missing: use .get(..., []). ready means there is at least one container and all are ready.'
  explain: Turning the big kubectl JSON into small flat dicts first keeps the checks in the next steps short and easy to test.
