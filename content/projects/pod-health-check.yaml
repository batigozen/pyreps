  solution: |
    import json
    from voicelab import fake_kubectl

    def load_pods(text):
        pods = []
        for item in json.loads(text)["items"]:
            status = item["status"]
            statuses = status.get("containerStatuses", [])
            ready = [c["ready"] for c in statuses]
            restarts = sum(c["restartCount"] for c in statuses)
            pods.append({
                "name": item["metadata"]["name"],
                "phase": status["phase"],
                "ready": bool(ready) and all(ready),
                "restarts": restarts,
            })
        return pods

    def problems(pod, max_restarts=3):
        found = []
        if pod["phase"] != "Running":
            found.append("not running")
        if not pod["ready"]:
            found.append("not ready")
        if pod["restarts"] >= max_restarts:
            found.append(f"restarts {pod['restarts']}")
        return found

    DOWN = {"not running", "not ready"}


    def health(pods):
        code, lines = 0, []
        for pod in pods:
            found = problems(pod)
            if not found:
                continue
            down = any(problem in DOWN for problem in found)
            code = max(code, 2 if down else 1)
            level = "CRITICAL" if down else "WARNING"
            text = ", ".join(found)
            lines.append(f"{level} {pod['name']}: {text}")
        if code == 0:
            lines.append("OK all pods healthy")
        return code, lines


    def main():
        code, lines = health(load_pods(fake_kubectl()))
        for line in lines:
            print(line)
        return code

    if __name__ == "__main__":
        # On a real machine: sys.exit(main()), for Nagios.
        print("exit code", main())
  tests: |
    code, lines = health(load_pods(fake_kubectl()))
    check(lambda: code == 2, "a pod that is not ready makes it CRITICAL (2)")
    check(lambda: lines[0] == "CRITICAL cdr-exporter-g62q9xtk4r-bjmw2: not ready, restarts 6", "first line: CRITICAL cdr-exporter-...: not ready, restarts 6")
    check(lambda: health([{"name": "a", "phase": "Running", "ready": True, "restarts": 4}])[0] == 1, "restarts alone give WARNING (1)")
    check(lambda: health([{"name": "a", "phase": "Running", "ready": True, "restarts": 0}]) == (0, ["OK all pods healthy"]), "all healthy gives (0, ['OK all pods healthy'])")
  hint: 'For each pod with problems: it is down when "not running" or "not ready" is in the list. Keep code = max(code, 2 if down else 1), and add a line like f"{level} {name}: {'', ''.join(found)}".'
  explain: max() keeps the worst result, so one CRITICAL pod turns the whole check red. Exported to a-Shell, the same script runs against real kubectl output once you swap fake_kubectl for subprocess.run.
