  solution: |
    from voicelab import load_cdrs

    class TrunkStats:
        def __init__(self, name):
            self.name = name
            self.calls = 0
            self.answered = 0
            self.talk_s = 0

        def add(self, row):
            self.calls += 1
            if row["sip_code"] == "200":
                self.answered += 1
                self.talk_s += int(row["duration_s"])

        @property
        def asr(self):
            if not self.calls:
                return 0.0
            return self.answered / self.calls

        @property
        def acd(self):
            """Average talk time of answered calls (s)."""
            if not self.answered:
                return 0.0
            return self.talk_s / self.answered


    def build_stats(rows):
        stats = {}
        for row in rows:
            name = row["trunk"]
            if name not in stats:
                stats[name] = TrunkStats(name)
            stats[name].add(row)
        return stats

    stats = build_stats(load_cdrs())
    print(len(stats), "trunks")
  tests: |
    s = build_stats(load_cdrs())
    r = s["ic-rtd-02"]
    check(lambda: (r.calls, r.answered, r.talk_s) == (15, 6, 936), "ic-rtd-02: 15 calls, 6 answered, 936 s of talk")
    check(lambda: r.asr == 0.4 and r.acd == 156.0, "ic-rtd-02: asr 0.4 and acd 156.0")
    e = TrunkStats("empty")
    check(lambda: e.asr == 0.0 and e.acd == 0.0, "a trunk with no calls has asr and acd 0.0")
    check(lambda: isinstance(TrunkStats.__dict__.get("acd"), property), "acd should be a @property")
  hint: In __init__ set calls, answered and talk_s to 0. add() always counts the call; for sip_code "200" it also counts answered and adds int(duration_s). The properties divide, and return 0.0 when they would divide by 0.
  explain: ASR (answer-seizure ratio) and ACD (average call duration) are the two basic trunk KPIs. Properties keep them correct after every add().
