  solution: |
    import json
    from voicelab import load_cdrs

    class TrunkStats:
        def __init__(self, name):
            self.name = name
            self.calls = 0
            self.answered = 0
            self.talk_s = 0

        def add(self, row):
            self.calls += 1
            if row["sip_code"] == "200":
                self.answered += 1
                self.talk_s += int(row["duration_s"])

        @property
        def asr(self):
            if not self.calls:
                return 0.0
            return self.answered / self.calls

        @property
        def acd(self):
            """Average talk time of answered calls (s)."""
            if not self.answered:
                return 0.0
            return self.talk_s / self.answered


    def build_stats(rows):
        stats = {}
        for row in rows:
            name = row["trunk"]
            if name not in stats:
                stats[name] = TrunkStats(name)
            stats[name].add(row)
        return stats

    def report(stats):
        head = f"{'trunk':<14}{'calls':>6}{'asr':>8}{'acd':>8}"
        lines = [head]
        for name in sorted(stats):
            s = stats[name]
            lines.append(f"{name:<14}{s.calls:>6}"
                         f"{s.asr:>8.1%}{s.acd:>8.1f}")
        return lines

    def to_json(stats):
        data = {name: {"calls": s.calls,
                       "asr": round(s.asr, 3),
                       "acd": round(s.acd, 1)}
                for name, s in stats.items()}
        return json.dumps(data, indent=2, sort_keys=True)

    print(to_json(build_stats(load_cdrs())))
  tests: |
    import json as _json
    out = to_json(build_stats(load_cdrs()))
    data = _json.loads(out)
    check(lambda: data["ic-ams-01"] == {"calls": 17, "asr": 0.588, "acd": 251.6}, "ic-ams-01: 17 calls, asr 0.588, acd 251.6")
    check(lambda: list(data) == sorted(data), "trunks in sorted order (sort_keys=True)")
    check(lambda: "\n  " in out, "indented with 2 spaces (indent=2)")
    check(lambda: to_json({}) == "{}", "no trunks gives '{}'")
  hint: 'Build {name: {"calls": ..., "asr": round(s.asr, 3), "acd": round(s.acd, 1)}} with a dict comprehension, then json.dumps(data, indent=2, sort_keys=True).'
  explain: 'JSON is the format for other tools: a dashboard, a ticket, or the next script. Round in the data, not just in the display, so the file stays small and readable.'
