    from voicelab import load_cdrs

    class TrunkStats:
        def __init__(self, name):
            self.name = name
            self.calls = 0
            self.answered = 0
            self.talk_s = 0

        def add(self, row):
            self.calls += 1
            if row["sip_code"] == "200":
                self.answered += 1
                self.talk_s += int(row["duration_s"])

        @property
        def asr(self):
            if not self.calls:
                return 0.0
            return self.answered / self.calls

        @property
        def acd(self):
            """Average talk time of answered calls (s)."""
            if not self.answered:
                return 0.0
            return self.talk_s / self.answered


    def build_stats(rows):
        stats = {}
        for row in rows:
            name = row["trunk"]
            if name not in stats:
                stats[name] = TrunkStats(name)
            stats[name].add(row)
        return stats

    def report(stats):
        head = f"{'trunk':<14}{'calls':>6}{'asr':>8}{'acd':>8}"
        lines = [head]
        for name in sorted(stats):
            s = stats[name]
            lines.append(f"{name:<14}{s.calls:>6}"
                         f"{s.asr:>8.1%}{s.acd:>8.1f}")
        return lines

    for line in report(build_stats(load_cdrs())):
        print(line)
  tests: |
    lines = report(build_stats(load_cdrs()))
    check(lambda: lines[0] == "trunk          calls     asr     acd", "the header: trunk, calls, asr, acd")
    check(lambda: lines[1].startswith("biz-trunk-07") and len(lines) == 4, "one row per trunk, sorted by name")
    check(lambda: lines[3] == "ic-rtd-02         15   40.0%   156.0", "ic-rtd-02 row: 15 calls, 40.0%, 156.0")
  hint: 'Header: f"{''trunk'':<14}{''calls'':>6}{''asr'':>8}{''acd'':>8}". Rows use the same widths with format specs: :>8.1% for asr and :>8.1f for acd.'
  explain: Same widths in header and rows keep the columns straight. A fixed sort order makes two days' reports easy to compare.
