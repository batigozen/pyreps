- id: unpack-fill-dict-union
  type: fill
  topic: unpack
  level: 2
  prompt: Merge the two dicts so the env value wins.
  code: |
    defaults = {"threshold": 0.65, "timeout": 5}
    env = {"threshold": 0.6}
    cfg = defaults ____ env
    print(cfg)
  blanks:
    - answer: "|"
      options: ["|", "+", "&", "or"]
  expected_output: "{'threshold': 0.6, 'timeout': 5}"
  explain: >-
    | merges two dicts into a new one (Python 3.9+), and the right side wins.
    + is not defined for dicts. `defaults or env` just returns defaults, because a
    non-empty dict is true.
  tags: [merge, union]

