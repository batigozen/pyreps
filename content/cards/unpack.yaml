- id: unpack-spotbug-missing-star
  type: spot_bug
  topic: unpack
  level: 3
  prompt: This should add up the call durations. Tap the line with the bug.
  code: |
    def total(*durations):
        return sum(durations)

    durations = [140, 35, 410]
    print(total(durations))
  bug_line: 5
  fixed_code: |
    def total(*durations):
        return sum(durations)

    durations = [140, 35, 410]
    print(total(*durations))
  expected_output: "585"
  explain: >-
