- id: unpack-parsons-header-rows
  type: parsons
  topic: unpack
  level: 2
  prompt: Put the lines in order to turn the CSV text into dicts.
  setup: |
    text = "call_id,trunk,sip_code\nc1000,biz-trunk-07,200\nc1001,ic-rtd-02,480"
  lines:
    - "header, *rows = text.splitlines()"
    - "names = header.split(\",\")"
    - "for row in rows:"
    - "    call = dict(zip(names, row.split(\",\")))"
    - "    print(call[\"call_id\"], call[\"sip_code\"])"
  distractors:
    - "header, rows = text.splitlines()"
  expected_output: |
    c1000 200
    c1001 480
  explain: >-
    `header, *rows` takes the first line and keeps the rest in a list. Without the
    star there are three lines for two names, so Python raises ValueError.
    csv.DictReader does this for you on real files.
  tags: [star, csv]

- id: unpack-parsons-kwargs-defaults
  type: parsons
  topic: unpack
  level: 2
  prompt: Put the lines in order so make_cfg(timeout=10) keeps retries and changes timeout.
  lines:
    - "def make_cfg(**overrides):"
    - "    base = {\"timeout\": 5, \"retries\": 3}"
    - "    return {**base, **overrides}"
    - "cfg = make_cfg(timeout=10)"
    - "print(cfg)"
  distractors:
    - "    return {**overrides, **base}"
    - "def make_cfg(*overrides):"
  expected_output: "{'timeout': 10, 'retries': 3}"
  explain: >-
    **overrides collects keyword arguments into a dict. Spreading base first and
    overrides last lets the caller's values win. *overrides would collect positional
    arguments into a tuple, and timeout=10 would raise TypeError.
  tags: [kwargs, double-star]

- id: unpack-parsons-worst-code
  type: parsons
  topic: unpack
  level: 3
  prompt: Put the lines in order so it prints 503, then None.
  lines:
    - "def worst(*codes):"
    - "    errors = [c for c in codes if c >= 500]"
    - "    return max(errors, default=None)"
    - "print(worst(200, 503, 486, 500))"
    - "print(worst(*[200, 486]))"
  distractors:
    - "def worst(codes):"
    - "print(worst([200, 503, 486, 500]))"
  expected_output: |
    503
    None
  explain: >-
    *codes collects any number of arguments into a tuple. A list must be spread with
    * to match. max() of an empty list raises ValueError, so default=None returns
    None when there are no 5xx codes.
  tags: [args, star]

- id: unpack-write-merge-layers
  type: write
  topic: unpack
  level: 2
  prompt: Merge any number of config dicts into one. Later dicts win.
  starter: |
    def merge(*layers):
        """merge(defaults, from_file, from_env) -> one dict"""
        return {}

    defaults = {"timeout": 5, "threshold": 0.65}
    from_env = {"threshold": 0.6}
    print(merge(defaults, from_env))
  tests: |
    check(lambda: merge(defaults, from_env) == {"timeout": 5, "threshold": 0.6}, "threshold from env (0.6) should win")
    check(lambda: merge({"a": 1}, {"a": 2}, {"a": 3}) == {"a": 3}, "the last dict should win")
    check(lambda: merge() == {}, "no dicts should give {}")
    merge(defaults, from_env)
    check(lambda: defaults["threshold"] == 0.65, "defaults must not change")
  hint: >-
    Start with result = {}. For each layer in layers, build a new dict with
    {**result, **layer}, or use result |= layer.
  solution: |
    def merge(*layers):
        result = {}
        for layer in layers:
            result = {**result, **layer}
        return result

    defaults = {"timeout": 5, "threshold": 0.65}
    from_env = {"threshold": 0.6}
    print(merge(defaults, from_env))
  explain: >-
    *layers takes any number of dicts as a tuple. Building a new dict each time keeps
    the inputs unchanged, which matters when the same defaults are used again.
  tags: [args, merge, double-star]
