- id: unpack-predict-star-rest
  type: predict
  topic: unpack
  level: 1
  prompt: What does this print?
  code: |
    codes = [200, 486, 503, 200, 480]
    first, *rest = codes
    head, *_, last = codes
    print(first, len(rest), last)
  answer: 200 4 480
  explain: >-
    *rest collects everything after the first item into a list (4 items).
    In head, *_, last the star collects the middle, and last is the final item.
  tags: [star]

- id: unpack-predict-merge-dicts
  type: predict
  topic: unpack
  level: 1
  prompt: What does this print?
  code: |
    defaults = {"threshold": 0.65, "timeout": 5}
    from_env = {"threshold": 0.6}
    cfg = {**defaults, **from_env}
    print(cfg["threshold"], cfg["timeout"],
          defaults["threshold"])
  answer: 0.6 5 0.65
  options: ["0.6 5 0.65", "0.65 5 0.65", "0.6 5 0.6", "0.65 5 0.6"]
  explain: >-
    Later keys win while the new dict is built, so threshold is 0.6. The original
    defaults dict isn't changed: {**a, **b} builds a new dict.
  tags: [double-star, merge]

- id: unpack-fill-call-kwargs
  type: fill
  topic: unpack
  level: 1
  prompt: Pass the settings dict as keyword arguments.
  code: |
    def connect(host, port, user, timeout=5):
        print(f"{user}@{host}:{port} timeout={timeout}")

    settings = {"host": "cdr-db", "port": 5432, "user": "oss"}
    connect(____settings, timeout=10)
  blanks:
    - answer: "**"
      options: ["**", "*", "&", "..."]
  expected_output: oss@cdr-db:5432 timeout=10
  explain: >-
    ** spreads a dict into keyword arguments whose names match the keys.
    One * would spread the KEYS as positional arguments.
  tags: [double-star, call]

- id: unpack-mcq-args-type
