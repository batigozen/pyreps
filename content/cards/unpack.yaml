- id: unpack-spotbug-single-star
  type: spot_bug
  topic: unpack
  level: 2
  prompt: The log line should show the real host. Tap the buggy line.
  code: |
    def describe(host, port):
        return f"{host}:{port}"

    target = {"host": "prometheus.monitoring", "port": 9090}
    print(describe(*target))
  bug_line: 5
  fixed_code: |
    def describe(host, port):
        return f"{host}:{port}"

    target = {"host": "prometheus.monitoring", "port": 9090}
    print(describe(**target))
  expected_output: prometheus.monitoring:9090
  explain: >-
    *target spreads the dict's KEYS, so describe("host", "port") printed "host:port".
    **target spreads key=value pairs.
  tags: [star, double-star]

- id: unpack-write-kubectl-args
  type: write
  topic: unpack
  level: 2
  prompt: Turn keyword flags into kubectl arguments.
  starter: |
    def kubectl_args(verb, resource, **flags):
        """kubectl_args("get", "pods", namespace="oss")
        -> ["get", "pods", "--namespace=oss"]"""
        return []

    print(kubectl_args("get", "pods", namespace="voice-oss",
                       output="json"))
  tests: |
    check(lambda: kubectl_args("get", "pods", namespace="voice-oss", output="json") == ["get", "pods", "--namespace=voice-oss", "--output=json"], "docstring example")
    check(lambda: kubectl_args("describe", "pod") == ["describe", "pod"], "no flags -> just verb and resource")
  hint: flags is a dict. Build f"--{k}={v}" for each item and spread that list into the result with *.
  solution: |
    def kubectl_args(verb, resource, **flags):
        opts = [f"--{k}={v}" for k, v in flags.items()]
        return [verb, resource, *opts]

    print(kubectl_args("get", "pods", namespace="voice-oss",
                       output="json"))
  explain: "[*a, *b] builds one list from two; **flags collected the keyword arguments into a dict."
  tags: [kwargs, star]

- id: unpack-predict-swap
  type: predict
  topic: unpack
  level: 1
  prompt: What does this print?
  code: |
    primary, backup = "sbc-ic-01", "sbc-ic-02"
    primary, backup = backup, primary
    print(primary, backup)
  answer: "sbc-ic-02 sbc-ic-01"
  explain: >-
    The right side is built first as a tuple ("sbc-ic-02", "sbc-ic-01"), then unpacked
    into the two names. So a swap needs no temporary variable, unlike in Java.
  tags: [swap, tuple]

- id: unpack-predict-star-call
  type: predict
  topic: unpack
  level: 1
  prompt: What does this print?
  code: |
    def route(trunk, code, sbc):
        return f"{trunk}/{code} via {sbc}"

    args = ["ic-ams-01", 486, "sbc-ic-01"]
    print(route(*args))
  answer: "ic-ams-01/486 via sbc-ic-01"
  options:
    - "ic-ams-01/486 via sbc-ic-01"
    - "['ic-ams-01', 486, 'sbc-ic-01']/None via None"
    - "ic-ams-01/486 via ['sbc-ic-01']"
    - "['ic-ams-01', 486, 'sbc-ic-01']"
  explain: >-
    *args spreads the list into three positional arguments, in order:
    route("ic-ams-01", 486, "sbc-ic-01"). Without the star the whole list would be
    one argument, and Python would complain about the two missing ones.
  tags: [star, call]

- id: unpack-predict-dict-union
  type: predict
  topic: unpack
  level: 2
  prompt: What does this print?
  code: |
    defaults = {"timeout": 5, "retries": 3}
    env = {"retries": 1}
    cfg = defaults | env
    defaults |= {"timeout": 9}
    print(cfg, defaults["timeout"])
  answer: "{'timeout': 5, 'retries': 1} 9"
  options:
    - "{'timeout': 5, 'retries': 1} 9"
    - "{'timeout': 9, 'retries': 1} 9"
    - "{'timeout': 5, 'retries': 3} 9"
    - "{'timeout': 5, 'retries': 1} 5"
  explain: >-
    a | b builds a new dict where b's keys win, like {**a, **b}. a |= b changes a in
    place. cfg was built before the change, so it still has timeout 5.
  tags: [merge, union]

- id: unpack-predict-nested
  type: predict
  topic: unpack
  level: 3
  prompt: What does this print?
  code: |
    calls = [("c1000", ("biz-trunk-07", 200)),
             ("c1001", ("ic-rtd-02", 480))]
    for call_id, (trunk, code) in calls:
        if code != 200:
            print(call_id, trunk)
  answer: "c1001 ic-rtd-02"
  explain: >-
    The pattern `call_id, (trunk, code)` has the same shape as each item, so Python
    unpacks the inner tuple too. Only c1001 has a code other than 200.
  tags: [nested, loop]

- id: unpack-mcq-keyword-only
  type: mcq
  topic: unpack
  level: 2
  prompt: Which call works?
  code: |
    def connect(host, *, timeout=5):
        return f"{host} timeout={timeout}"
  options:
    - connect("cdr-db", timeout=3)
    - connect("cdr-db", 3)
    - connect(timeout=3)
    - connect("cdr-db", 3, 5)
  correct: 0
  explain: >-
    A bare * in the parameters means every parameter after it is keyword-only. So
    timeout must be written as timeout=3. connect("cdr-db", 3) raises TypeError.
    This stops callers from mixing up the order of options.
  tags: [keyword-only]

- id: unpack-mcq-too-many-values
  type: mcq
  topic: unpack
  level: 2
  prompt: What happens here?
  code: |
    record = ("ic-ams-01", "200", 445)
    trunk, code = record
  options:
    - "ValueError: too many values to unpack"
    - "trunk is ic-ams-01 and code is 200; 445 is ignored"
    - "code becomes (\"200\", 445)"
    - "IndexError"
  correct: 0
  explain: >-
    The number of names must match the number of values. To keep the rest, use a star:
    trunk, *rest = record. To drop it, use trunk, code, _ = record.
  tags: [raises, star]

