# DATACLASSES: dataclasses, enums and inheritance (about 20 cards).
- id: dataclasses-predict-repr-eq
  type: predict
  topic: dataclasses
  level: 1
  prompt: What does this print?
  code: |
    from dataclasses import dataclass

    @dataclass
    class Cdr:
        call_id: str
        trunk: str
        sip_code: int

    a = Cdr("c1001", "ic-rtd-02", 480)
    print(a)
    print(a == Cdr("c1001", "ic-rtd-02", 480))
  answer: |-
    Cdr(call_id='c1001', trunk='ic-rtd-02', sip_code=480)
    True
  options:
    - "Cdr(call_id='c1001', trunk='ic-rtd-02', sip_code=480)\nTrue"
    - "<Cdr object>\nFalse"
    - "Cdr(c1001, ic-rtd-02, 480)\nTrue"
    - "Cdr(call_id='c1001', trunk='ic-rtd-02', sip_code=480)\nFalse"
  explain: >-
    @dataclass writes __init__, __repr__ and __eq__ from the field list. The repr shows
    every field, and == compares the fields, so two records with the same data are
    equal.
  tags: [dataclass, repr, eq]

- id: dataclasses-predict-order
  type: predict
  topic: dataclasses
  level: 2
  prompt: What does this print?
  code: |
    from dataclasses import dataclass

    @dataclass(order=True)
    class Alarm:
        severity: int
        name: str

    alarms = [Alarm(2, "low-asr"), Alarm(1, "high-503"),
              Alarm(2, "high-487")]
    print([a.name for a in sorted(alarms)])
  answer: "['high-503', 'high-487', 'low-asr']"
  options:
    - "['high-503', 'high-487', 'low-asr']"
    - "['high-487', 'high-503', 'low-asr']"
    - "['high-503', 'low-asr', 'high-487']"
    - "['low-asr', 'high-487', 'high-503']"
  explain: >-
    order=True compares objects like tuples of their fields, top to bottom: severity
    first, and name only when the severities are equal. So the order of the fields
    is the sort order.
  tags: [dataclass, order]

- id: dataclasses-predict-compare-false
  type: predict
  topic: dataclasses
  level: 2
  prompt: What does this print?
  code: |
    from dataclasses import dataclass, field

    @dataclass
    class Alarm:
        name: str
        sbc: str
        seen_at: str = field(compare=False)

    a = Alarm("high-503", "sbc-ic-02", "09:05")
    b = Alarm("high-503", "sbc-ic-02", "09:16")
    print(a == b)
  answer: "True"
  explain: >-
    field(compare=False) leaves seen_at out of == (and out of ordering). The same
    alarm seen twice is equal, which helps when you remove duplicates.
  tags: [dataclass, field]

- id: dataclasses-predict-enum
  type: predict
  topic: dataclasses
  level: 1
  prompt: What does this print?
  code: |
    from enum import Enum

    class Severity(Enum):
        CRITICAL = "crit"
        WARNING = "warn"

    s = Severity.CRITICAL
    print(s.name, s.value, Severity("warn"))
  answer: "CRITICAL crit Severity.WARNING"
  options:
    - "CRITICAL crit Severity.WARNING"
    - "crit CRITICAL Severity.WARNING"
    - "CRITICAL crit warn"
    - "Severity.CRITICAL crit WARNING"
  explain: >-
    .name is the Python name, .value is what you assigned. Severity("warn") looks a
    member up by its value, which is handy when the value comes from JSON or a config
    file.
  tags: [enum]

- id: dataclasses-predict-post-init
  type: predict
  topic: dataclasses
  level: 2
  prompt: What does this print?
  code: |
    from dataclasses import dataclass, field

    @dataclass
    class TrunkStats:
        calls: int
        ok: int
        asr: float = field(init=False)

        def __post_init__(self):
            self.asr = round(self.ok / self.calls, 2)

    print(TrunkStats(17, 10))
  answer: "TrunkStats(calls=17, ok=10, asr=0.59)"
  explain: >-
    __post_init__ runs right after the generated __init__, so it can work out extra
    fields. field(init=False) keeps asr out of the constructor, but it still shows in
    the repr.
  tags: [dataclass, post-init]

- id: dataclasses-predict-super-init
  type: predict
  topic: dataclasses
  level: 2
  prompt: What does this print?
  code: |
    class Pod:
        def __init__(self, name):
            self.name = name
            self.restarts = 0

    class SipPod(Pod):
        def __init__(self, name, port):
            super().__init__(name)
            self.port = port

    p = SipPod("sip-proxy-x2k9p", 5060)
    print(p.name, p.restarts, p.port, isinstance(p, Pod))
  answer: "sip-proxy-x2k9p 0 5060 True"
  explain: >-
    super().__init__(name) runs the parent's __init__, which sets name and restarts.
    Then the child adds port. A SipPod is also a Pod, so isinstance says True.
  tags: [inheritance, super]

- id: dataclasses-mcq-generated
  type: mcq
  topic: dataclasses
  level: 1
  prompt: Which methods does a plain @dataclass write for you?
  options:
    - __init__, __repr__ and __eq__
    - __init__ only
    - __init__, __repr__, __eq__ and __lt__
    - __str__ and __hash__
  correct: 0
  explain: >-
    The defaults are __init__, __repr__ and __eq__. order=True adds <, <=, > and >=.
    frozen=True (with eq) also adds __hash__.
  tags: [dataclass]

- id: dataclasses-mcq-frozen
  type: mcq
  topic: dataclasses
  level: 2
  prompt: What happens on the last line?
  code: |
    from dataclasses import dataclass

    @dataclass(frozen=True)
    class Config:
        timeout: int = 5

    cfg = Config()
    cfg.timeout = 10
  options:
    - "It raises FrozenInstanceError"
    - "It works: timeout is 10"
    - "Nothing happens; timeout stays 5"
    - "It creates a new Config"
  correct: 0
  explain: >-
    A frozen dataclass can't be changed after it is made. To get a changed copy, use
    dataclasses.replace(cfg, timeout=10). Frozen objects can also be dict keys and set
    items.
  tags: [dataclass, frozen, raises]

- id: dataclasses-mcq-override-attr
  type: mcq
  topic: dataclasses
  level: 2
  prompt: What are p.port and Pod.port?
  code: |
    class Pod:
        port = 8080

    class SipPod(Pod):
        port = 5060

    p = SipPod()
  options:
    - 5060 and 8080
    - 5060 and 5060
    - 8080 and 8080
    - 8080 and 5060
  correct: 0
  explain: >-
    Python looks for p.port on the object, then on SipPod, then on Pod. SipPod's own
    port hides the parent's for SipPod objects, and Pod keeps 8080.
  tags: [inheritance, class-attribute]

- id: dataclasses-fill-default-factory
  type: fill
  topic: dataclasses
  level: 2
  prompt: Give each Sbc its own new alarm list.
  code: |
    from dataclasses import dataclass, field

    @dataclass
    class Sbc:
        name: str
        alarms: list = field(____=list)

    a = Sbc("sbc-ic-01")
    a.alarms.append("high-503")
    print(Sbc("sbc-ic-02").alarms)
  blanks:
    - answer: default_factory
      options: [default_factory, default, factory, init]
  expected_output: "[]"
  explain: >-
    default_factory=list calls list() for every new object. A plain = [] default is
    refused by dataclasses for this reason: it would be shared, the trap from the
    functions and classes topics.
  tags: [dataclass, field, mutable]

