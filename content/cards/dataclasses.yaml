- id: dataclasses-fill-frozen
  type: fill
  topic: dataclasses
  level: 2
  prompt: Make Route usable in a set.
  code: |
    from dataclasses import dataclass

    @dataclass(____=True)
    class Route:
        trunk: str
        prefix: str

    routes = {Route("ic-ams-01", "+3120"),
              Route("ic-ams-01", "+3120"),
              Route("ic-rtd-02", "+3110")}
    print(len(routes))
  blanks:
    - answer: frozen
      options: [frozen, final, const, readonly]
  expected_output: "2"
  explain: >-
    A frozen dataclass can't change, so Python gives it a __hash__ from its fields.
    Two equal routes count once in a set. A normal dataclass is unhashable.
  tags: [dataclass, frozen, hashable]

- id: dataclasses-spotbug-mutable-default
  type: spot_bug
  topic: dataclasses
  level: 2
  prompt: This should print an empty list. Tap the line with the bug.
  code: |
    from dataclasses import dataclass, field

    @dataclass
    class Sbc:
        name: str
        alarms: list = []

    print(Sbc("sbc-ic-01").alarms)
  bug_line: 6
  fixed_code: |
    from dataclasses import dataclass, field

    @dataclass
    class Sbc:
        name: str
        alarms: list = field(default_factory=list)

    print(Sbc("sbc-ic-01").alarms)
  expected_output: "[]"
  explain: >-
    dataclasses refuse a list, dict or set as a plain default: "ValueError: mutable
    default ... use default_factory". field(default_factory=list) makes a new list
    for each object.
  tags: [dataclass, mutable]

- id: dataclasses-spotbug-parent-init
  type: spot_bug
  topic: dataclasses
  level: 2
  prompt: This should print "sip-proxy-x2k9p 5060". Tap the line with the bug.
  code: |
    class Pod:
        def __init__(self, name):
            self.name = name

    class SipPod(Pod):
        def __init__(self, name, port):
            Pod.__init__(name)
            self.port = port

    p = SipPod("sip-proxy-x2k9p", 5060)
    print(p.name, p.port)
  bug_line: 7
  fixed_code: |
    class Pod:
        def __init__(self, name):
            self.name = name

    class SipPod(Pod):
        def __init__(self, name, port):
            super().__init__(name)
            self.port = port

    p = SipPod("sip-proxy-x2k9p", 5060)
    print(p.name, p.port)
  expected_output: "sip-proxy-x2k9p 5060"
  explain: >-
    Pod.__init__(name) calls the method on the class without an object, so name lands
    in self and the real name is missing: TypeError. super().__init__(name) passes
    self for you.
  tags: [inheritance, super]

- id: dataclasses-spotbug-enum-string
  type: spot_bug
  topic: dataclasses
  level: 3
  prompt: This should print "page the on-call". Tap the line with the bug.
  code: |
    from enum import Enum

    class Severity(Enum):
        CRITICAL = "crit"
        WARNING = "warn"

    sev = Severity("crit")
    if sev == "crit":
        print("page the on-call")
    else:
        print("log only")
  bug_line: 8
  fixed_code: |
    from enum import Enum

    class Severity(Enum):
        CRITICAL = "crit"
        WARNING = "warn"

    sev = Severity("crit")
    if sev == Severity.CRITICAL:
        print("page the on-call")
    else:
        print("log only")
  expected_output: "page the on-call"
  explain: >-
    An Enum member is not equal to its value: Severity.CRITICAL == "crit" is False.
    Compare with the member, or use sev.value == "crit". (StrEnum members do equal
    their strings.)
  tags: [enum]

- id: dataclasses-parsons-define
  type: parsons
  topic: dataclasses
  level: 1
  prompt: "Put the lines in order so it prints Trunk(name='ic-ams-01', calls=17)."
  lines:
    - "from dataclasses import dataclass"
    - "@dataclass"
    - "class Trunk:"
    - "    name: str"
    - "    calls: int"
    - "t = Trunk(\"ic-ams-01\", 17)"
    - "print(t)"
  distractors:
    - "    name = str"
  expected_output: "Trunk(name='ic-ams-01', calls=17)"
  explain: >-
    Fields are written as `name: type`. The order of the fields is the order of the
    __init__ arguments, so "ic-ams-01" goes to name. `name = str` would be a class
    attribute, not a field.
  tags: [dataclass]

- id: dataclasses-parsons-post-init
  type: parsons
  topic: dataclasses
  level: 2
  prompt: Put the lines in order so TrunkStats(15, 6) prints 0.4.
  setup: |
    from dataclasses import dataclass
  lines:
    - "@dataclass"
    - "class TrunkStats:"
    - "    calls: int"
    - "    ok: int"
    - "    def __post_init__(self):"
    - "        self.asr = self.ok / self.calls"
    - "print(TrunkStats(15, 6).asr)"
  distractors:
    - "    def __init__(self):"
  expected_output: "0.4"
