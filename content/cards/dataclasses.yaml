- id: dataclasses-parsons-enum-classmethod
  type: parsons
  topic: dataclasses
  level: 2
  prompt: Put the lines in order to print the class of each SIP code.
  setup: |
    from enum import Enum

    class SipClass(Enum):
        SUCCESS = 2
        CLIENT_ERROR = 4
        SERVER_ERROR = 5

        @classmethod
        def of(cls, code):
            return cls(code // 100)
  lines:
    - "codes = [200, 486, 503]"
    - "for code in codes:"
    - "    sip_class = SipClass.of(code)"
    - "    print(code, sip_class.name)"
  distractors:
    - "    sip_class = SipClass(code)"
  expected_output: |-
    200 SUCCESS
    486 CLIENT_ERROR
    503 SERVER_ERROR
  explain: >-
    The classmethod turns a code into a member: 486 // 100 is 4, and SipClass(4) is
    CLIENT_ERROR. SipClass(486) would raise ValueError, because no member has the
    value 486.
  tags: [enum, classmethod]

- id: dataclasses-write-pod
  type: write
  topic: dataclasses
  level: 2
  prompt: "Make Pod a dataclass: name, restarts (default 0), labels (default: a new empty dict), and a property healthy that is True when restarts < 3."
  starter: |
    from dataclasses import dataclass, field

    class Pod:
        pass

    p = Pod("cdr-exporter-bjmw2", restarts=6)
    print(p, p.healthy)
  tests: |
    p = Pod("cdr-exporter-bjmw2", restarts=6)
    check(lambda: p.name == "cdr-exporter-bjmw2" and p.restarts == 6, "Pod(name, restarts=6) works")
    check(lambda: Pod("x").restarts == 0, "restarts defaults to 0")
    a, b = Pod("a"), Pod("b")
    a.labels["app"] = "sip-proxy"
    check(lambda: b.labels == {}, "each pod gets its own labels dict")
    check(lambda: Pod("x", 2).healthy and not p.healthy, "healthy means restarts < 3")
    check(lambda: Pod("x") == Pod("x"), "two equal pods compare equal (@dataclass)")
  hint: >-
    Put @dataclass on the class and list the fields: name: str, restarts: int = 0,
    labels: dict = field(default_factory=dict). Then add @property healthy.
  solution: |
    from dataclasses import dataclass, field

    @dataclass
    class Pod:
        name: str
        restarts: int = 0
        labels: dict = field(default_factory=dict)

        @property
        def healthy(self):
            return self.restarts < 3

    p = Pod("cdr-exporter-bjmw2", restarts=6)
    print(p, p.healthy)
  explain: >-
    A dataclass removes the boilerplate (__init__, __repr__, __eq__) and still lets
    you add methods and properties. The cdr-exporter pod in the sample data restarted
    6 times, so it is not healthy.
  tags: [dataclass, field, property]

- id: dataclasses-write-severity
  type: write
  topic: dataclasses
  level: 3
  prompt: "Write the Severity enum (OK=\"ok\", WARN=\"warn\", CRIT=\"crit\") with a classmethod from_asr: below 0.5 is CRIT, below 0.8 is WARN, else OK."
  starter: |
    from enum import Enum

    class Severity:
        pass

    for asr in (0.4, 0.59, 0.81):
        print(asr, Severity.from_asr(asr))
  tests: |
    check(lambda: issubclass(Severity, Enum), "Severity should be an Enum")
    check(lambda: Severity("crit") is Severity.CRIT, "the value of CRIT is 'crit'")
    check(lambda: Severity.from_asr(0.4) is Severity.CRIT, "0.4 is CRIT")
    check(lambda: Severity.from_asr(0.59) is Severity.WARN, "0.59 is WARN")
    check(lambda: Severity.from_asr(0.8) is Severity.OK, "0.8 is OK (not below 0.8)")
  hint: >-
    class Severity(Enum): with three members. Then @classmethod def from_asr(cls,
    asr): return cls.CRIT if asr < 0.5, cls.WARN if asr < 0.8, otherwise cls.OK.
  solution: |
    from enum import Enum

    class Severity(Enum):
        OK = "ok"
        WARN = "warn"
        CRIT = "crit"

        @classmethod
        def from_asr(cls, asr):
            if asr < 0.5:
                return cls.CRIT
            if asr < 0.8:
                return cls.WARN
            return cls.OK

    for asr in (0.4, 0.59, 0.81):
        print(asr, Severity.from_asr(asr))
  explain: >-
    An Enum gives a fixed set of named values instead of loose strings, so a typo
    like "crti" fails loudly. The classmethod keeps the thresholds next to the levels
    they produce.
  tags: [enum, classmethod]
