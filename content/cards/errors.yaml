- id: errors-parsons-env-number
  type: parsons
  topic: errors
  level: 2
  prompt: Put the lines in order to read THRESHOLD and report a bad value.
  setup: |
    env = {"THRESHOLD": "0,65"}
  lines:
    - "try:"
    - "    threshold = float(env[\"THRESHOLD\"])"
    - "except ValueError:"
    - "    print(\"THRESHOLD is not a number\")"
    - "else:"
    - "    print(\"threshold\", threshold)"
  distractors:
    - "except KeyError:"
  expected_output: "THRESHOLD is not a number"
  explain: >-
    "0,65" uses a comma, so float() raises ValueError. The else part only runs when
    the try worked, which keeps the try block to the one risky line.
  tags: [try, else]

- id: errors-parsons-raise-from
  type: parsons
  topic: errors
  level: 3
  prompt: Put the lines in order to wrap the low-level error in a ConfigError.
  setup: |
    class ConfigError(Exception):
        pass
  lines:
    - "def load_timeout(text):"
    - "    try:"
    - "        return int(text)"
    - "    except ValueError as err:"
    - "        raise ConfigError(f\"bad timeout: {text}\") from err"
    - "try:"
    - "    load_timeout(\"5s\")"
    - "except ConfigError as e:"
    - "    print(e, \"<-\", type(e.__cause__).__name__)"
  distractors:
    - "        raise ConfigError(f\"bad timeout: {text}\")"
  expected_output: "bad timeout: 5s <- ValueError"
  explain: >-
    The function speaks the caller's language (ConfigError) and keeps the reason
    (ValueError) as the cause. Without `from err`, __cause__ is None.
  tags: [raise-from, custom-exception]

