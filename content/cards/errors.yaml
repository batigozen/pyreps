- id: errors-write-read-threshold
  type: write
  topic: errors
  level: 2
  prompt: "Return THRESHOLD from env as a float; 0.65 if missing. A bad value raises ConfigError from the ValueError."
  starter: |
    class ConfigError(Exception):
        pass

    def read_threshold(env):
        return float(env["THRESHOLD"])

    print(read_threshold({"THRESHOLD": "0.6"}))
  tests: |
    check(lambda: read_threshold({"THRESHOLD": "0.6"}) == 0.6, "'0.6' gives 0.6")
    check(lambda: read_threshold({}) == 0.65, "missing gives the default 0.65")
    try:
        read_threshold({"THRESHOLD": "0,6"})
        err = None
    except Exception as e:
        err = e
    check(lambda: isinstance(err, ConfigError), "'0,6' should raise ConfigError")
    check(lambda: isinstance(err.__cause__, ValueError), "the ConfigError should come `from` the ValueError")
  hint: >-
    text = env.get("THRESHOLD"); if it is None, return 0.65. Then try float(text), and
    in `except ValueError as err:` raise ConfigError(...) from err.
  solution: |
    class ConfigError(Exception):
        pass

    def read_threshold(env):
        text = env.get("THRESHOLD")
        if text is None:
            return 0.65
        try:
            return float(text)
        except ValueError as err:
            msg = f"THRESHOLD must be a number, got {text!r}"
            raise ConfigError(msg) from err

    print(read_threshold({"THRESHOLD": "0.6"}))
  explain: >-
    A missing value has a safe default; a broken value is a real problem and should
    stop the script with a clear message. The cause keeps the technical detail for
    whoever debugs it.
  tags: [raise-from, custom-exception]

- id: errors-write-probe-all
  type: write
  topic: errors
  level: 3
  prompt: "Call probe(sbc) for each SBC. Return {sbc: \"ok\" or \"down: <message>\"}. Only TimeoutError and ConnectionError count as down."
  starter: |
    def fake_probe(sbc):
        if sbc == "sbc-ic-02":
            raise TimeoutError("no reply to OPTIONS")
        return "200 OK"

    def probe_all(sbcs, probe):
        return {}

    print(probe_all(["sbc-ic-01", "sbc-ic-02"], fake_probe))
  tests: |
    r = probe_all(["sbc-ic-01", "sbc-ic-02"], fake_probe)
    check(lambda: r == {"sbc-ic-01": "ok", "sbc-ic-02": "down: no reply to OPTIONS"}, "sbc-ic-02 is down, sbc-ic-01 ok")
    def refused(sbc):
        raise ConnectionError("refused")
    check(lambda: probe_all(["sbc-biz-01"], refused) == {"sbc-biz-01": "down: refused"}, "ConnectionError also counts as down")
    def buggy(sbc):
        raise KeyError("oops")
    try:
        probe_all(["x"], buggy)
        passed_on = False
    except KeyError:
        passed_on = True
    check(lambda: passed_on, "other errors (a KeyError bug) must not be hidden")
  hint: >-
    Loop over the SBCs. try: probe(sbc), then result[sbc] = "ok". except
    (TimeoutError, ConnectionError) as err: result[sbc] = f"down: {err}".
  solution: |
    def fake_probe(sbc):
        if sbc == "sbc-ic-02":
            raise TimeoutError("no reply to OPTIONS")
        return "200 OK"

    def probe_all(sbcs, probe):
        result = {}
        for sbc in sbcs:
            try:
                probe(sbc)
            except (TimeoutError, ConnectionError) as err:
                result[sbc] = f"down: {err}"
            else:
                result[sbc] = "ok"
        return result

    print(probe_all(["sbc-ic-01", "sbc-ic-02"], fake_probe))
  explain: >-
    One SBC being down must not stop the check of the others, so the expected network
    errors are caught per SBC. A bug in your own code is different: it should crash
    loudly, so it isn't caught.
  tags: [except, tuple]
