- id: iter-fill-max-key
  type: fill
  topic: iter
  level: 2
  prompt: Find the trunk with the most calls.
  code: |
    counts = {"ic-ams-01": 17, "ic-rtd-02": 15,
              "biz-trunk-07": 16}
    busiest = max(counts, key=counts.____)
    print(busiest)
  blanks:
    - answer: get
      options: [get, items, values, keys]
  expected_output: "ic-ams-01"
  explain: >-
    max() over a dict looks at the keys. key=counts.get compares them by their
    values, so you get the key with the biggest value. Without key=, max(counts)
    compares the names.
  tags: [max, key]

- id: iter-spotbug-generator-reused
  type: spot_bug
  topic: iter
  level: 3
  prompt: This should print "29 48". Tap the line with the bug.
  code: |
    from voicelab import load_cdrs
    codes = (r["sip_code"] for r in load_cdrs())
    total = sum(1 for c in codes)
    ok = sum(1 for c in codes if c == "200")
    print(ok, total)
  bug_line: 2
  fixed_code: |
    from voicelab import load_cdrs
    codes = [r["sip_code"] for r in load_cdrs()]
    total = sum(1 for c in codes)
    ok = sum(1 for c in codes if c == "200")
    print(ok, total)
  expected_output: "29 48"
  explain: >-
    Round brackets made a generator, and counting `total` used it up, so `ok` saw
    nothing and printed 0. Square brackets build a list that can be read many times.
  tags: [generator, exhausted]

