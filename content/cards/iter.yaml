# ITER: comprehensions, generators and the helpers around them (about 20 cards).
- id: iter-predict-list-comp-if
  type: predict
  topic: iter
  level: 1
  prompt: What does this print?
  code: |
    codes = [200, 503, 486, 200, 500]
    errors = [c for c in codes if c >= 500]
    print(errors)
  answer: "[503, 500]"
  explain: >-
    A list comprehension with `if` keeps only the items where the condition is true,
    in their original order. It is the short form of a for loop with an if and
    append.
  tags: [comprehension]

- id: iter-predict-set-comp
  type: predict
  topic: iter
  level: 2
  prompt: What does this print?
  code: |
    from voicelab import load_cdrs
    rows = load_cdrs()
    bad = {r["trunk"] for r in rows if r["sip_code"] == "503"}
    print(sorted(bad), len(bad))
  answer: "['ic-ams-01', 'ic-rtd-02'] 2"
  options:
    - "['ic-ams-01', 'ic-rtd-02'] 2"
    - "['ic-ams-01', 'ic-rtd-02', 'ic-rtd-02', 'ic-rtd-02'] 4"
    - "['ic-rtd-02'] 1"
    - "{'ic-ams-01', 'ic-rtd-02'} 2"
  explain: >-
    Curly braces with a single expression build a set, so each trunk appears once,
    even though there are 4 calls with 503. sorted() turns the set into a list, which
    also makes the order fixed.
  tags: [comprehension, set]

- id: iter-predict-generator-exhausted
  type: predict
  topic: iter
  level: 3
  prompt: What does this print?
  code: |
    codes = [200, 503, 486, 200]
    failed = (c for c in codes if c != 200)
    print(list(failed))
    print(list(failed))
  answer: |-
    [503, 486]
    []
  options:
    - "[503, 486]\n[]"
    - "[503, 486]\n[503, 486]"
    - "<generator object>\n[503, 486]"
    - "[503, 486]\nNone"
  explain: >-
    A generator gives each value once. The first list() uses it up, so the second
    one gets nothing and returns []. If you need the values twice, build a list
    instead: [c for c in codes if c != 200].
  tags: [generator, exhausted]

- id: iter-predict-zip-shortest
  type: predict
  topic: iter
  level: 2
  prompt: What does this print?
  code: |
    trunks = ["ic-ams-01", "ic-rtd-02", "biz-trunk-07"]
    asr = [0.59, 0.4]
    for t, a in zip(trunks, asr):
        print(t, a)
  answer: |-
    ic-ams-01 0.59
    ic-rtd-02 0.4
  options:
    - "ic-ams-01 0.59\nic-rtd-02 0.4"
    - "ic-ams-01 0.59\nic-rtd-02 0.4\nbiz-trunk-07 None"
    - "IndexError"
    - "('ic-ams-01', 0.59)\n('ic-rtd-02', 0.4)"
  explain: >-
    zip stops at the shortest input, without an error. biz-trunk-07 has no partner,
    so it is skipped. Use zip(a, b, strict=True) when the lengths must match.
  tags: [zip]

- id: iter-predict-enumerate-start
  type: predict
  topic: iter
  level: 1
  prompt: What does this print?
  code: |
    sbcs = ["sbc-ic-01", "sbc-ic-02"]
    for i, sbc in enumerate(sbcs, start=1):
        print(f"{i}. {sbc}")
  answer: |
    1. sbc-ic-01
    2. sbc-ic-02
  explain: >-
    enumerate gives (number, item) pairs. It starts at 0 unless you pass start=1,
    which is what humans expect in a numbered list.
  tags: [enumerate]

- id: iter-predict-generator-lazy
  type: predict
  topic: iter
  level: 3
  prompt: What does this print?
  code: |
    def first_word(lines):
        for line in lines:
            print("read", line)
            yield line.split()[0]

    words = first_word(["200 OK", "486 Busy"])
    print("start")
    print(next(words))
  answer: |-
    start
    read 200 OK
    200
  options:
    - "start\nread 200 OK\n200"
    - "read 200 OK\nread 486 Busy\nstart\n200"
    - "start\n200"
    - "read 200 OK\nstart\n200"
  explain: >-
    Calling a generator function runs none of its body. The body only runs when you
    ask for a value with next() or a loop, and it stops again at the first yield.
    That is why "start" comes first and "486 Busy" is never read.
  tags: [generator, yield, lazy]

- id: iter-mcq-generator-memory
  type: mcq
  topic: iter
  level: 2
  prompt: >-
    You add up the durations of 10 million CDRs. Why write
    sum(r["duration"] for r in rows) instead of sum([r["duration"] for r in rows])?
  options:
    - The generator never builds a 10-million-item list in memory
    - A generator is always faster than a list
    - sum() can't take a list
    - There is no difference at all
  correct: 0
  explain: >-
    The generator gives one value at a time to sum(), so memory stays small. The list
    version first builds the full list. Use a list when you need the values more than
    once.
  tags: [generator, memory]

- id: iter-mcq-any-all
  type: mcq
  topic: iter
  level: 1
  prompt: Which of these is True?
  code: |
    codes = [200, 200, 503]
  options:
    - any(c >= 500 for c in codes)
    - all(c == 200 for c in codes)
    - all(c >= 500 for c in codes)
    - any(c == 404 for c in codes)
  correct: 0
  explain: >-
    any() is True if at least one item matches; all() only if every item matches.
    One code is 503, so any(c >= 500 ...) is True, and all(c == 200 ...) is False.
  tags: [any, all]

- id: iter-mcq-islice
  type: mcq
  topic: iter
  level: 2
  prompt: Why use islice(lines, 2) here instead of lines[:2]?
  code: |
    from itertools import islice
    lines = (line for line in open("data/sip.log"))
    first = list(islice(lines, 2))
  options:
    - A generator has no [:2]; it raises TypeError
    - islice is faster on lists
    - lines[:2] would read the whole file first
    - "[:2] would skip the first two lines"
  correct: 0
  explain: >-
    Generators don't support indexing or slicing. islice takes the first n values
    lazily and stops, so the rest of the file is never read.
  tags: [islice, generator]

- id: iter-fill-dict-comp-if
