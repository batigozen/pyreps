  prompt: Put the lines in order to print the numbered trunks with an ASR under 50%.
  setup: |
    trunks = ["ic-ams-01", "ic-rtd-02", "biz-trunk-07"]
    asr = [0.59, 0.4, 0.81]
  lines:
    - "for i, (t, a) in enumerate(zip(trunks, asr), start=1):"
    - "    if a < 0.5:"
    - "        print(f\"{i}. {t} is low: {a:.0%}\")"
  distractors:
    - "for i, t, a in enumerate(zip(trunks, asr), start=1):"
  expected_output: "2. ic-rtd-02 is low: 40%"
  explain: >-
    zip pairs each trunk with its ASR, and enumerate adds a number in front. Each item
    is (i, (t, a)), so the names need the inner brackets. Without them Python raises
    ValueError.
