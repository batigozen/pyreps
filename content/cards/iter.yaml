- id: iter-fill-sorted-key
  type: fill
  topic: iter
  level: 2
  prompt: Sort the calls by setup time, slowest first.
  code: |
    calls = [{"id": "c1003", "ms": 554},
             {"id": "c1004", "ms": 3087},
             {"id": "c1000", "ms": 445}]
    slow = sorted(calls, ____=lambda c: c["ms"], reverse=True)
    print([c["id"] for c in slow])
  blanks:
    - answer: key
      options: [key, cmp, by, sort]
  expected_output: "['c1004', 'c1003', 'c1000']"
  explain: >-
