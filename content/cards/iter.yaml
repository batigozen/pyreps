- id: iter-spotbug-min-key
  type: spot_bug
  topic: iter
  level: 2
  prompt: This should print the trunk with the lowest ASR. Tap the line with the bug.
  code: |
    asr = {"ic-ams-01": 0.59, "ic-rtd-02": 0.4,
           "biz-trunk-07": 0.81}
    worst = min(asr)
    print(worst)
  bug_line: 3
  fixed_code: |
    asr = {"ic-ams-01": 0.59, "ic-rtd-02": 0.4,
           "biz-trunk-07": 0.81}
    worst = min(asr, key=asr.get)
    print(worst)
  expected_output: "ic-rtd-02"
  explain: >-
    min(asr) compares the keys, so it returned the first name in alphabetical order.
    key=asr.get compares the values and still returns the key.
  tags: [min, key]

- id: iter-parsons-failed-generator
  type: parsons
  topic: iter
  level: 2
  prompt: Put the lines in order to print the first three failed call ids.
  setup: |
    from itertools import islice
    from voicelab import load_cdrs
    rows = load_cdrs()
  lines:
    - "def failed(rows):"
    - "    for row in rows:"
    - "        if row[\"sip_code\"] != \"200\":"
    - "            yield row[\"call_id\"]"
    - "first_three = list(islice(failed(rows), 3))"
    - "print(first_three)"
  distractors:
    - "            return row[\"call_id\"]"
  expected_output: "['c1001', 'c1004', 'c1009']"
  explain: >-
    yield makes failed() a generator that gives one id at a time. islice stops after
    three, so the other rows are never checked. return would end the function at the
    first failed call.
  tags: [generator, yield, islice]

- id: iter-parsons-zip-enumerate
  type: parsons
  topic: iter
