- id: iter-parsons-all-running
  type: parsons
  topic: iter
  level: 2
  prompt: Put the lines in order to report whether all pods are running.
  setup: |
    import json
    from voicelab import fake_kubectl
    pods = json.loads(fake_kubectl())["items"]
  lines:
    - "phases = [p[\"status\"][\"phase\"] for p in pods]"
    - "if all(ph == \"Running\" for ph in phases):"
    - "    print(\"all running\")"
    - "else:"
    - "    print(phases.count(\"Pending\"), \"pending\")"
  distractors:
    - "if any(ph == \"Running\" for ph in phases):"
  expected_output: "1 pending"
  explain: >-
    all() is True only if every pod is Running; one Pending pod makes it False.
    any() would be True as soon as one pod runs, which hides the problem.
    On a real machine you'd get this JSON from kubectl get pods -o json.
  tags: [all, any, comprehension]

- id: iter-write-slow-calls
  type: write
  topic: iter
  level: 3
  prompt: Write a generator that yields (call_id, setup_ms) for every call slower than limit_ms.
  starter: |
    from voicelab import read_log

    def setup_ms(line):
        return int(line.rsplit("=", 1)[1])

    def call_id(line):
        return line.split("call-id=")[1].split()[0]

    def slow_calls(lines, limit_ms):
        """Skip lines that have no setup_ms."""
        return []

    print(list(slow_calls(read_log(), 1000)))
  tests: |
    import types
    check(lambda: isinstance(slow_calls(read_log(), 1000), types.GeneratorType), "slow_calls should be a generator (use yield)")
    check(lambda: list(slow_calls(read_log(), 1000)) == [("c1004@ic", 3087), ("c1013@ic", 3014)], "two calls take more than 1000 ms")
    check(lambda: next(slow_calls(read_log(), 500)) == ("c1003@ic", 554), "the first call above 500 ms is c1003")
    check(lambda: list(slow_calls(read_log(), 5000)) == [], "no call takes more than 5000 ms")
  hint: >-
    Loop over the lines. If "setup_ms=" is not in the line, continue. Otherwise get the
    number with setup_ms(line), and yield (call_id(line), ms) when it is above the limit.
  solution: |
    from voicelab import read_log

    def setup_ms(line):
        return int(line.rsplit("=", 1)[1])

    def call_id(line):
        return line.split("call-id=")[1].split()[0]

    def slow_calls(lines, limit_ms):
        for line in lines:
            if "setup_ms=" not in line:
                continue
            ms = setup_ms(line)
            if ms > limit_ms:
                yield call_id(line), ms

    print(list(slow_calls(read_log(), 1000)))
  explain: >-
    A generator reads a huge log one line at a time, so memory stays small. The log
    has a keepalive line and a cut-off line; checking for "setup_ms=" first skips both
    instead of crashing.
  tags: [generator, yield, log]

- id: iter-write-rank-trunks
  type: write
  topic: iter
  level: 2
  prompt: Return the trunk names from worst to best ASR. Equal ASRs go in name order.
  starter: |
    def rank_trunks(asr):
        """rank_trunks({"a": 0.9, "b": 0.4}) -> ["b", "a"]"""
        return list(asr)

    asr = {"ic-ams-01": 0.59, "ic-rtd-02": 0.4,
           "biz-trunk-07": 0.81}
    print(rank_trunks(asr))
  tests: |
    check(lambda: rank_trunks(asr) == ["ic-rtd-02", "ic-ams-01", "biz-trunk-07"], "worst (ic-rtd-02) first, best last")
    check(lambda: rank_trunks({"b": 0.5, "a": 0.5}) == ["a", "b"], "equal ASRs go in name order")
    check(lambda: rank_trunks({}) == [], "no trunks should give []")
  hint: >-
    sorted(asr, key=...) sorts the names. Make the key a tuple: (asr[t], t) sorts by
    ASR first and by name when the ASRs are equal.
  solution: |
    def rank_trunks(asr):
        return sorted(asr, key=lambda t: (asr[t], t))

    asr = {"ic-ams-01": 0.59, "ic-rtd-02": 0.4,
           "biz-trunk-07": 0.81}
    print(rank_trunks(asr))
  explain: >-
    A tuple as the key sorts by the first item, then uses the second to break ties.
    This is how you sort by several fields at once in Python.
  tags: [sorted, key, lambda]
