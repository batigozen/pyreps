- id: classes-fill-setter
  type: fill
  topic: classes
  level: 2
  prompt: Check the value whenever threshold is set.
  code: |
    class AlarmRule:
        def __init__(self, threshold):
            self.threshold = threshold

        @property
        def threshold(self):
            return self._threshold

        @threshold.____
        def threshold(self, value):
            if not 0 <= value <= 1:
                raise ValueError("threshold must be 0..1")
            self._threshold = value

    rule = AlarmRule(0.65)
    rule.threshold = 0.6
    print(rule.threshold)
  blanks:
    - answer: setter
      options: [setter, getter, property, set]
  expected_output: "0.6"
  explain: >-
    @threshold.setter runs on every assignment, also the one in __init__. The value is
    stored in _threshold, an internal name, so the property and the data don't clash.
  tags: [property, setter, validation]

