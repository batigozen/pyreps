# CLASSES: __init__, self, attributes, properties, classmethod, staticmethod (about 20 cards).
- id: classes-predict-init-self
  type: predict
  topic: classes
  level: 1
  prompt: What does this print?
  code: |
    class Trunk:
        def __init__(self, name, calls):
            self.name = name
            self.calls = calls

    t = Trunk("ic-ams-01", 17)
    t.calls += 1
    print(t.name, t.calls)
  answer: "ic-ams-01 18"
  explain: >-
    Trunk(...) makes a new object and runs __init__ with self set to that object.
    self.name = ... stores data on the object. Python has no `new` and no field list:
    attributes appear when you assign them.
  tags: [init, self]

- id: classes-predict-method-call
  type: predict
  topic: classes
  level: 2
  prompt: What does this print?
  code: |
    class Trunk:
        def __init__(self, name):
            self.name = name

        def describe(self):
            return f"trunk {self.name}"

    t = Trunk("ic-rtd-02")
    print(t.describe())
    print(Trunk.describe(t))
  answer: |-
    trunk ic-rtd-02
    trunk ic-rtd-02
  options:
    - "trunk ic-rtd-02\ntrunk ic-rtd-02"
    - "trunk ic-rtd-02\ntrunk t"
    - "trunk ic-rtd-02\ntrunk Trunk"
    - "trunk ic-rtd-02\ntrunk None"
  explain: >-
    t.describe() is short for Trunk.describe(t): Python passes the object as the first
    argument, self. That's all self is, a normal parameter.
  tags: [self, method]

- id: classes-predict-shared-list
  type: predict
  topic: classes
  level: 3
  prompt: What does this print?
  code: |
    class Sbc:
        alarms = []

        def __init__(self, name):
            self.name = name

    a = Sbc("sbc-ic-01")
    b = Sbc("sbc-ic-02")
    a.alarms.append("high-503")
    print(b.alarms)
  answer: "['high-503']"
  options:
    - "['high-503']"
    - "[]"
    - "['sbc-ic-02']"
    - "None"
  explain: >-
    alarms is a class attribute: one list for the class, shared by every object.
    a.alarms.append changes that one list, so b sees it too. Give each object its own
    list in __init__: self.alarms = [].
  tags: [class-attribute, mutable]

- id: classes-predict-property
  type: predict
  topic: classes
  level: 2
  prompt: What does this print?
  code: |
    class TrunkStats:
        def __init__(self, ok, calls):
            self.ok = ok
            self.calls = calls

        @property
        def asr(self):
            return self.ok / self.calls

    s = TrunkStats(6, 15)
    s.ok = 9
    print(s.asr)
  answer: "0.6"
  options:
    - "0.6"
    - "0.4"
    - "0.9"
    - "None"
  explain: >-
    A property runs its method each time you read it, without brackets. s.asr is
    worked out from the current ok and calls, so the change to 9 shows up: 9 / 15.
  tags: [property]

- id: classes-predict-classmethod
  type: predict
  topic: classes
  level: 2
  prompt: What does this print?
  code: |
    class Trunk:
        def __init__(self, name, region):
            self.name = name
            self.region = region

        @classmethod
        def from_id(cls, trunk_id):
            kind, region, number = trunk_id.split("-")
            return cls(trunk_id, region)

    t = Trunk.from_id("ic-ams-01")
    print(t.name, t.region)
  answer: "ic-ams-01 ams"
  explain: >-
    A classmethod gets the class as cls, so cls(...) builds a new object. This is
    Python's way to have several constructors, like a static factory method in Java.
  tags: [classmethod]

- id: classes-predict-instance-shadows
  type: predict
