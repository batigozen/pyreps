- id: classes-mcq-self
  type: mcq
  topic: classes
  level: 1
  prompt: In t.describe(), what is self inside describe?
  code: |
    class Trunk:
        def describe(self):
            return "a trunk"

    t = Trunk()
    t.describe()
  options:
    - The object t
    - The class Trunk
    - A copy of t
    - Nothing; self is a keyword
  correct: 0
  explain: >-
    self is the object the method was called on, passed in for you. It is just a
    name by convention, not a keyword, like `this` in Java but written out.
  tags: [self]

- id: classes-mcq-staticmethod
  type: mcq
  topic: classes
  level: 2
  prompt: Why is sip_class marked @staticmethod?
  code: |
    class Cdr:
        @staticmethod
        def sip_class(code):
            return f"{code // 100}xx"

    print(Cdr.sip_class(486))
  options:
    - It needs neither self nor cls; it just lives in the class
    - It runs faster than a normal method
    - It can only be called on the class, not on objects
    - It makes the method private
  correct: 0
  explain: >-
    A staticmethod is a plain function kept in the class because it belongs there.
    It gets no self or cls. It can be called as Cdr.sip_class(486) or on an object.
  tags: [staticmethod]

- id: classes-mcq-underscore
  type: mcq
  topic: classes
  level: 1
  prompt: What does the underscore in self._token mean?
  options:
    - "Internal: please don't use it from outside. Python doesn't stop you."
    - "Private: Python blocks access from outside the class."
    - "It is a class attribute."
    - "It can't be changed."
  correct: 0
  explain: >-
    One leading underscore is a naming convention for "internal". Python has no
    private keyword; anyone can still read obj._token. Tools and readers respect the
    hint.
  tags: [naming, internal]

