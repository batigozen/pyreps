- id: classes-write-trunk-stats
  type: write
  topic: classes
  level: 2
  prompt: Finish TrunkStats. add() counts a call; asr is a property (0.0 when there are no calls).
  starter: |
    from voicelab import load_cdrs

    class TrunkStats:
        def __init__(self, name):
            self.name = name

        def add(self, sip_code):
            pass

    s = TrunkStats("ic-rtd-02")
    for row in load_cdrs():
        if row["trunk"] == s.name:
            s.add(row["sip_code"])
    print(s.calls, s.ok)
  tests: |
    t = TrunkStats("x")
    check(lambda: t.asr == 0.0, "no calls should give asr 0.0")
    for code in ["200", "486", "200", "503"]:
        t.add(code)
    check(lambda: (t.calls, t.ok) == (4, 2), "4 calls with 2 answered")
    check(lambda: t.asr == 0.5, "asr is 2 / 4 = 0.5")
    check(lambda: isinstance(TrunkStats.__dict__.get("asr"), property), "asr should be a @property")
  hint: >-
    In __init__, also set self.calls = 0 and self.ok = 0. add() adds 1 to calls and
    adds sip_code == "200" to ok. The asr property returns 0.0 when calls is 0.
  solution: |
    from voicelab import load_cdrs

    class TrunkStats:
        def __init__(self, name):
            self.name = name
            self.calls = 0
            self.ok = 0

        def add(self, sip_code):
            self.calls += 1
            self.ok += sip_code == "200"

        @property
        def asr(self):
            return self.ok / self.calls if self.calls else 0.0

    s = TrunkStats("ic-rtd-02")
    for row in load_cdrs():
        if row["trunk"] == s.name:
            s.add(row["sip_code"])
    print(s.calls, s.ok)
  explain: >-
    The object keeps its counters, and asr is always worked out from them, so it is
    never out of date. Guarding against 0 calls avoids a ZeroDivisionError for a new
    trunk.
  tags: [property, objects]

- id: classes-write-alarm-rule
  type: write
  topic: classes
  level: 3
  prompt: "Make threshold a property that only accepts 0..1 (else ValueError). Add from_percent(65) -> threshold 0.65."
  starter: |
    class AlarmRule:
        def __init__(self, threshold):
            self.threshold = threshold

    rule = AlarmRule(0.65)
    rule.threshold = 0.6
    print(rule.threshold)
  tests: |
    def raises(action):
        try:
            action()
        except ValueError:
            return True
        return False
    rule = AlarmRule(0.65)
    check(lambda: raises(lambda: setattr(rule, "threshold", 1.5)), "setting 1.5 should raise ValueError")
    check(lambda: raises(lambda: AlarmRule(-0.1)), "AlarmRule(-0.1) should raise ValueError too")
    rule.threshold = 0.6
    check(lambda: rule.threshold == 0.6, "0.6 is fine")
    check(lambda: AlarmRule.from_percent(65).threshold == 0.65, "from_percent(65) gives 0.65")
  hint: >-
    Add a @property threshold that returns self._threshold, and a @threshold.setter
    that raises ValueError unless 0 <= value <= 1. from_percent is a @classmethod that
    returns cls(percent / 100).
  solution: |
    class AlarmRule:
        def __init__(self, threshold):
            self.threshold = threshold

        @property
        def threshold(self):
            return self._threshold

        @threshold.setter
        def threshold(self, value):
            if not 0 <= value <= 1:
                raise ValueError("threshold must be 0..1")
            self._threshold = value

        @classmethod
        def from_percent(cls, percent):
            return cls(percent / 100)

    rule = AlarmRule(0.65)
    rule.threshold = 0.6
    print(rule.threshold)
  explain: >-
    The setter also runs in __init__, so a bad value can never get in, not even at
    creation. This is the Pythonic way to do Java's getters and setters: plain
    attributes first, a property only when you need a check.
  tags: [property, setter, classmethod]
