    class Check:
        threshold = 0.65

    a = Check()
    b = Check()
    a.threshold = 0.5
    print(a.threshold, b.threshold, Check.threshold)
  answer: "0.5 0.65 0.65"
  options:
    - "0.5 0.65 0.65"
    - "0.5 0.5 0.5"
    - "0.5 0.5 0.65"
    - "0.65 0.65 0.65"
