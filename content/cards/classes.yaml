- id: classes-spotbug-setter-recursion
  type: spot_bug
  topic: classes
  level: 3
  prompt: This should print 0.65. Tap the line with the bug.
  code: |
    class Check:
        def __init__(self, threshold):
            self.threshold = threshold

        @property
        def threshold(self):
            return self._threshold

        @threshold.setter
        def threshold(self, value):
            self.threshold = value

    print(Check(0.65).threshold)
  bug_line: 11
  fixed_code: |
    class Check:
        def __init__(self, threshold):
            self.threshold = threshold

        @property
        def threshold(self):
            return self._threshold

        @threshold.setter
        def threshold(self, value):
            self._threshold = value

    print(Check(0.65).threshold)
  expected_output: "0.65"
  explain: >-
    Inside the setter, self.threshold = value runs the setter again, forever, until
    RecursionError. Store the value under another name, _threshold.
  tags: [property, setter]

- id: classes-parsons-init
  type: parsons
  topic: classes
  level: 1
  prompt: Put the lines in order so it prints "486 False".
  lines:
    - "class Cdr:"
    - "    def __init__(self, row):"
    - "        self.code = int(row[\"sip_code\"])"
    - "        self.ok = self.code == 200"
    - "c = Cdr({\"sip_code\": \"486\"})"
    - "print(c.code, c.ok)"
  distractors:
    - "    def __init__(row):"
    - "        self.ok = code == 200"
  expected_output: "486 False"
  explain: >-
    __init__ needs self first. Inside it, the new attribute is self.code; a bare
    `code` would be an unknown name. self.ok can use self.code because it was set on
    the line before.
