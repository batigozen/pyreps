# CONCURRENCY deck: threads, futures, asyncio and rate limiting (about 15 cards).
# The app's Python has no threads and can't run asyncio.run(), so cards that run them
# are tap-only and tagged cpython-only. The write cards practise the logic around them.
- id: concurrency-predict-pool-map
  type: predict
  topic: concurrency
  level: 2
  prompt: What does this print? (This card runs on a real machine, not in the app.)
  code: |
    from concurrent.futures import ThreadPoolExecutor

    def probe(sbc):
        return f"{sbc}: 200 OK"

    sbcs = ["sbc-ic-01", "sbc-ic-02", "sbc-biz-01"]
    with ThreadPoolExecutor(max_workers=3) as pool:
        print(list(pool.map(probe, sbcs)))
  answer: "['sbc-ic-01: 200 OK', 'sbc-ic-02: 200 OK', 'sbc-biz-01: 200 OK']"
  explain: >-
    pool.map runs probe in several threads at once, but returns the results in the
    order of the inputs, whichever finishes first. The with block waits for all
    threads before it ends.
  tags: [threads, futures, cpython-only]

- id: concurrency-predict-gather-order
  type: predict
  topic: concurrency
  level: 2
  prompt: What does this print? (This card runs on a real machine, not in the app.)
  code: |
    import asyncio

    async def probe(sbc, delay):
        await asyncio.sleep(delay)
        return sbc

    async def main():
        replies = await asyncio.gather(probe("sbc-ic-01", 0.05),
                                       probe("sbc-ic-02", 0.01))
        print(replies)

    asyncio.run(main())
  answer: "['sbc-ic-01', 'sbc-ic-02']"
  options:
    - "['sbc-ic-01', 'sbc-ic-02']"
    - "['sbc-ic-02', 'sbc-ic-01']"
    - "sbc-ic-02"
    - "[<coroutine>, <coroutine>]"
  explain: >-
    gather runs both coroutines at the same time and returns their results in the
    order you passed them, not the order they finished. sbc-ic-02 finished first, but
    comes second.
  tags: [asyncio, gather, cpython-only]

- id: concurrency-predict-coroutine-object
  type: predict
  topic: concurrency
  level: 2
  prompt: What does this print?
  code: |
    async def probe(sbc):
        print("probing", sbc)
        return f"{sbc} 200 OK"

    c = probe("sbc-ic-01")
    print(type(c).__name__)
    c.close()
  answer: "coroutine"
  options:
    - "coroutine"
    - "probing sbc-ic-01\ncoroutine"
    - "sbc-ic-01 200 OK"
    - "str"
  explain: >-
    Calling an async function runs none of its body. It returns a coroutine object
    that only runs when you await it (or pass it to asyncio.run or gather). That's why
    a forgotten await "does nothing".
  tags: [asyncio, coroutine]

- id: concurrency-predict-batches
  type: predict
  topic: concurrency
  level: 2
  prompt: What does this print?
  code: |
    sbcs = [f"sbc-{n:02d}" for n in range(1, 8)]
    batches = [sbcs[i:i + 3] for i in range(0, len(sbcs), 3)]
    print(len(batches), batches[-1])
  answer: "3 ['sbc-07']"
  options:
    - "3 ['sbc-07']"
    - "2 ['sbc-04', 'sbc-05', 'sbc-06']"
    - "3 ['sbc-07', None, None]"
    - "7 ['sbc-07']"
  explain: >-
    Stepping by 3 and slicing [i:i + 3] cuts the list into groups of 3; the last group
    is just what's left. Sending one batch at a time is a simple way to limit load on
    an API.
  tags: [batching, slicing]

- id: concurrency-predict-semaphore
  type: predict
  topic: concurrency
  level: 3
  prompt: What does this print? (This card runs on a real machine, not in the app.)
  code: |
    import asyncio

    in_flight = peak = 0

    async def probe(sbc, limit):
        global in_flight, peak
        async with limit:
            in_flight += 1
            peak = max(peak, in_flight)
            await asyncio.sleep(0.01)
            in_flight -= 1
        return sbc

    async def main():
        limit = asyncio.Semaphore(2)
        sbcs = [f"sbc-{i}" for i in range(5)]
        jobs = [probe(s, limit) for s in sbcs]
        done = await asyncio.gather(*jobs)
        print(len(done), peak)

    asyncio.run(main())
  answer: "5 2"
  options:
    - "5 2"
    - "5 5"
    - "2 2"
    - "5 1"
  explain: >-
    gather starts all 5 at once, but the semaphore lets only 2 inside `async with` at
    the same time, so never more than 2 probes run together. That's how you
    rate-limit many requests.
  tags: [asyncio, semaphore, rate-limit, cpython-only]

- id: concurrency-mcq-gil
  type: mcq
  topic: concurrency
  level: 2
  prompt: In CPython, which job do threads speed up?
  options:
    - Waiting on many network calls, like probing 50 SBCs
    - Heavy maths on one big list
    - Sorting a list faster
    - "Any code: each thread gets its own CPU core"
  correct: 0
  explain: >-
    The GIL lets only one thread run Python code at a time. While a thread waits for
    the network, it lets go, so waiting overlaps. CPU-heavy work needs processes
    (multiprocessing) instead.
  tags: [gil, threads]

- id: concurrency-mcq-async-vs-threads
  type: mcq
  topic: concurrency
  level: 2
  prompt: When is asyncio a better choice than threads?
  options:
    - Thousands of connections that mostly wait, handled by one thread
    - Short scripts that call one API once
    - CPU-heavy work like hashing big files
    - Code that uses a library without async support
  correct: 0
  explain: >-
    An idle coroutine costs very little, so asyncio handles many waiting connections
    well. But every library in the chain must be async; with a blocking library,
    threads are simpler.
  tags: [asyncio, threads]

- id: concurrency-mcq-await-sleep
  type: mcq
  topic: concurrency
  level: 1
  prompt: Inside an async function, what does await asyncio.sleep(1) do that time.sleep(1) doesn't?
  options:
    - It lets other tasks run while this one waits
    - It sleeps more exactly
    - It runs the sleep in a new thread
    - Nothing; they are the same
  correct: 0
  explain: >-
    time.sleep blocks the whole event loop, so every task stops. await hands control
    back to the loop until the time is up.
  tags: [asyncio]

- id: concurrency-fill-lock
  type: fill
  topic: concurrency
  level: 2
  prompt: Protect the shared counter. (Runs on a real machine.)
  code: |
    import threading

    count = 0
    lock = threading.Lock()

    def add_calls(n):
        global count
        for _ in range(n):
            with ____:
                count += 1

    jobs = [threading.Thread(target=add_calls, args=(10_000,))
            for _ in range(4)]
    for job in jobs:
        job.start()
    for job in jobs:
        job.join()
    print(count)
  blanks:
    - answer: lock
      options: [lock, threading, count, "Lock()"]
  expected_output: "40000"
  explain: >-
    count += 1 is a read, an add and a write; two threads can read the same old value
    and lose an update. The shared lock lets one thread at a time through. A new
    Lock() each time would protect nothing.
  tags: [threads, lock, race, cpython-only]

