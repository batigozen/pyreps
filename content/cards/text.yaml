- id: text-write-talk-time
  type: write
  topic: text
  level: 2
  prompt: "Return {trunk: total duration_s} as ints, for every trunk."
  starter: |
    from voicelab import load_cdrs
    rows = load_cdrs()

    def talk_time(rows):
        """CSV values are strings."""
        return {}

    print(talk_time(rows))
  tests: |
    t = talk_time(rows)
    check(lambda: t.get("ic-rtd-02") == 936, "ic-rtd-02 talked 936 seconds")
    check(lambda: all(isinstance(v, int) for v in t.values()), "the values should be ints, not strings")
    check(lambda: sum(t.values()) == 6093, "all 48 calls add up to 6093 seconds")
    check(lambda: talk_time([]) == {}, "no rows should give {}")
  hint: >-
    Use a dict and .get(trunk, 0), or a defaultdict(int). Add
    int(row["duration_s"]) for each row.
  solution: |
    from voicelab import load_cdrs
    rows = load_cdrs()

    def talk_time(rows):
        total = {}
        for row in rows:
            t = row["trunk"]
            total[t] = total.get(t, 0) + int(row["duration_s"])
        return total

    print(talk_time(rows))
  explain: >-
    The CSV gives text; the report needs numbers. Converting at the edge, where the
    data comes in, keeps the rest of the code simple.
  tags: [csv, types, counting]

- id: text-write-calls-between
  type: write
  topic: text
  level: 3
  prompt: Count the calls that start at or after start, and before end. Both are ISO strings.
  starter: |
    from datetime import datetime
    from voicelab import load_cdrs
    rows = load_cdrs()

    def calls_between(rows, start, end):
        """calls_between(rows, "2026-10-21T09:00:00",
                         "2026-10-21T09:30:00") -> int"""
        return 0

    print(calls_between(rows, "2026-10-21T09:00:00",
                        "2026-10-21T09:30:00"))
  tests: |
    check(lambda: calls_between(rows, "2026-10-21T09:00:00", "2026-10-21T09:30:00") == 24, "24 calls start in the first half hour")
    check(lambda: calls_between(rows, "2026-10-21T09:30:00", "2026-10-21T10:00:00") == 24, "24 calls in the second half hour")
    check(lambda: calls_between(rows, "2026-10-21T09:00:15", "2026-10-21T09:00:16") == 1, "the start time itself counts")
    check(lambda: calls_between(rows, "2026-10-21T10:00:00", "2026-10-21T11:00:00") == 0, "no calls after 10:00")
  hint: >-
    Turn start and end into datetimes with datetime.fromisoformat once. For each row,
    convert row["start"] the same way and count it when start <= t < end.
  solution: |
    from datetime import datetime
    from voicelab import load_cdrs
    rows = load_cdrs()

    def calls_between(rows, start, end):
        lo = datetime.fromisoformat(start)
        hi = datetime.fromisoformat(end)
        count = 0
        for row in rows:
            t = datetime.fromisoformat(row["start"])
            if lo <= t < hi:
                count += 1
        return count

    print(calls_between(rows, "2026-10-21T09:00:00",
                        "2026-10-21T09:30:00"))
  explain: >-
    Compare datetimes, not strings: it works across days and formats. A half-open
    window [start, end) means each call lands in exactly one half hour.
  tags: [datetime]
