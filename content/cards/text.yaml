  tags: [json]

- id: text-fill-groupdict
  type: fill
  topic: text
  level: 2
  prompt: Turn the named groups into a dict.
  code: |
    import re
    line = "sbc-ic-02 INVITE -> 503 Service Unavailable"
    pattern = r"(?P<sbc>\S+) INVITE -> (?P<code>\d{3})"
    m = re.search(pattern, line)
    print(m.____())
  blanks:
    - answer: groupdict
      options: [groupdict, groups, group, dict]
  expected_output: "{'sbc': 'sbc-ic-02', 'code': '503'}"
  explain: >-
    (?P<name>...) names a group, and groupdict() returns {name: text}. groups() gives
    a tuple without names. m["code"] reads one group.
  tags: [regex, named-groups]

