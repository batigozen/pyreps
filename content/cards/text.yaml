- id: text-parsons-log-regex
  type: parsons
  topic: text
  level: 2
  prompt: Put the lines in order to print the SBC of every 503 in the log.
  setup: |
    import re
    from voicelab import read_log
  lines:
    - 'LINE = re.compile(r"(?P<sbc>sbc-\S+) .*-> (?P<code>\d+)")'
    - "for line in read_log():"
    - "    m = LINE.search(line)"
    - "    if m and m[\"code\"] == \"503\":"
    - "        print(m[\"sbc\"], m[\"code\"])"
  distractors:
    - "    if m[\"code\"] == \"503\":"
  expected_output: "sbc-ic-02 503"
  explain: >-
    Compile the pattern once, before the loop. search returns None for the keepalive
    line and the cut-off line, so check `m and ...` first. Without that check the
    program crashes on the first line that doesn't match.
  tags: [regex, named-groups]

