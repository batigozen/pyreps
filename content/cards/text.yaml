- id: text-spotbug-search-not-match
  type: spot_bug
  topic: text
  level: 2
  prompt: This should print 3087. Tap the line with the bug.
  code: |
    import re
    from voicelab import read_log
    line = read_log()[4]
    m = re.match(r"setup_ms=(\d+)", line)
    print(int(m[1]))
  bug_line: 4
  fixed_code: |
    import re
    from voicelab import read_log
    line = read_log()[4]
    m = re.search(r"setup_ms=(\d+)", line)
    print(int(m[1]))
  expected_output: "3087"
