- id: text-fill-strftime
  type: fill
  topic: text
  level: 1
  prompt: Show the call start as hours and minutes.
  code: |
    from datetime import datetime
    t = datetime.fromisoformat("2026-10-21T09:05:00")
    print(t.____("%H:%M"))
  blanks:
    - answer: strftime
      options: [strftime, strptime, format, isoformat]
  expected_output: "09:05"
  explain: >-
    strftime = "string from time" (datetime to text). strptime = "string parse time"
    (text to datetime). For ISO text, fromisoformat is simpler than strptime.
  tags: [datetime]

