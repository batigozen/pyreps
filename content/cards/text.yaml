# TEXT: f-string formats, regex, JSON, CSV and dates (about 20 cards).
- id: text-predict-align
  type: predict
  topic: text
  level: 1
  prompt: What does this print? (The | marks show the edges.)
  code: |
    name, calls = "ic-ams-01", 17
    print(f"|{name:<12}|{calls:>5}|")
  answer: "|ic-ams-01   |   17|"
  options:
    - "|ic-ams-01   |   17|"
    - "|   ic-ams-01|17   |"
    - "|ic-ams-01|17|"
    - "|ic-ams-01   |17   |"
  explain: >-
    :<12 pads to 12 characters with the text on the left; :>5 puts it on the right.
    Numbers usually go right-aligned so the digits line up in a table.
  tags: [f-string, format]

- id: text-predict-format-specs
  type: predict
  topic: text
  level: 1
  prompt: What does this print?
  code: |
    asr, cdrs, pod, ms = 0.5882, 48213, 7, 445.678
    print(f"{asr:.1%} {cdrs:,} {pod:03d} {ms:.2f}")
  answer: "58.8% 48,213 007 445.68"
  options:
    - "58.8% 48,213 007 445.68"
    - "0.6% 48213 7 445.68"
    - "58.8% 48.213 700 445.67"
    - "0.5882% 48,213 007 445.678"
  explain: >-
    .1% multiplies by 100 and adds %, with 1 decimal. , adds thousands separators.
    03d pads an int with zeros to 3 digits. .2f rounds to 2 decimals.
  tags: [f-string, format]

- id: text-predict-debug-equals
  type: predict
  topic: text
  level: 2
  prompt: What does this print?
  code: |
    trunk, asr = "ic-rtd-02", 0.4
    print(f"{trunk=} {asr=:.0%}")
  answer: "trunk='ic-rtd-02' asr=40%"
  options:
    - "trunk='ic-rtd-02' asr=40%"
    - "trunk=ic-rtd-02 asr=40%"
    - "ic-rtd-02 40%"
    - "trunk='ic-rtd-02' asr=0.4"
  explain: >-
    {x=} prints the name, an equals sign and the repr of the value, so strings get
    quotes. A format spec can follow: {asr=:.0%}. Great for quick debug prints.
  tags: [f-string, debug]

- id: text-predict-csv-strings
  type: predict
  topic: text
  level: 2
  prompt: What does this print?
  code: |
    from voicelab import load_cdrs
    row = load_cdrs()[0]
    print(row["duration_s"] + row["duration_s"],
          int(row["duration_s"]) * 2)
  answer: "140140 280"
  options:
    - "140140 280"
    - "280 280"
    - "140140 140140"
    - "280 140140"
  explain: >-
    csv.DictReader gives every value as a string, so + joins the text "140" twice.
    Convert numbers yourself with int() or float() before you calculate.
  tags: [csv, types]

- id: text-predict-json-get-chain
  type: predict
  topic: text
  level: 2
  prompt: What does this print?
  code: |
    import json
    from voicelab import fake_prometheus
    reply = json.loads(fake_prometheus("asr_failures"))
    result = reply.get("data", {}).get("result", [])
    first = result[1]
    print(len(result), first["metric"]["trunk"],
          float(first["value"][1]))
  answer: "3 ic-rtd-02 0.142"
  explain: >-
    .get("data", {}) returns an empty dict if the key is missing, so the next .get
    still works. A Prometheus value is [timestamp, "string"], so float() turns
    "0.142" into a number.
  tags: [json, get, prometheus]

- id: text-predict-timedelta
  type: predict
  topic: text
  level: 2
  prompt: What does this print?
  code: |
    from datetime import datetime, timedelta
    start = datetime.fromisoformat("2026-10-21T09:05:00")
    end = start + timedelta(minutes=12, seconds=30)
    print(end.strftime("%H:%M"), (end - start).total_seconds())
  answer: "09:17 750.0"
  options:
    - "09:17 750.0"
    - "09:17 12.5"
    - "09:18 750"
    - "9:17 750.0"
  explain: >-
    fromisoformat reads "2026-10-21T09:05:00". Adding a timedelta gives a new
    datetime. %H:%M shows hours and minutes with leading zeros, and the seconds are
    dropped, not rounded. Subtracting two datetimes gives a timedelta.
  tags: [datetime, timedelta]

- id: text-mcq-match-none
  type: mcq
  topic: text
  level: 2
  prompt: What is m?
  code: |
    import re
    m = re.match(r"\d{3}", "INVITE -> 503")
  options:
    - None, because match only looks at the start of the text
    - "A match for '503'"
    - "The string '503'"
    - It raises ValueError
  correct: 0
  explain: >-
    re.match only matches at position 0, and the text starts with "INVITE".
    re.search looks anywhere. Always check `if m:` before using a match, or you get
    AttributeError on None.
  tags: [regex, match]

- id: text-mcq-raw-string
  type: mcq
  topic: text
  level: 1
  prompt: Why are regex patterns written as r"\d+" instead of "\d+"?
  options:
    - So backslashes reach the regex engine as typed
    - Raw strings run faster
    - The r turns on case-insensitive matching
    - re only accepts raw strings
  correct: 0
  explain: >-
    In a normal string Python reads backslash escapes first: "\n" is a newline and
    "\b" a backspace. r"..." keeps every backslash, so "\b" stays a word boundary.
  tags: [regex, raw-string]

