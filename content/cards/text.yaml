- id: text-spotbug-json-load
  type: spot_bug
  topic: text
  level: 2
  prompt: This should print the first pod name. Tap the line with the bug.
  code: |
    import json
    from voicelab import fake_kubectl
    text = fake_kubectl("get", "pods", "-o", "json")
    pods = json.load(text)
    print(pods["items"][0]["metadata"]["name"])
  bug_line: 4
  fixed_code: |
    import json
    from voicelab import fake_kubectl
    text = fake_kubectl("get", "pods", "-o", "json")
    pods = json.loads(text)
    print(pods["items"][0]["metadata"]["name"])
