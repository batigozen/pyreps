# CLI: argparse and exit codes (about 20 cards). Cards call parse_args([...]) with a list,
# the testable way, and catch SystemExit to show the exit code.
- id: cli-predict-positional-option
  type: predict
  topic: cli
  level: 1
  prompt: What does this print?
  code: |
    import argparse
    parser = argparse.ArgumentParser(prog="asrcheck")
    parser.add_argument("trunk")
    parser.add_argument("--threshold", type=float, default=0.65)
    args = parser.parse_args(["ic-rtd-02", "--threshold=0.5"])
    t = args.threshold
    print(args.trunk, t, type(t).__name__)
  answer: "ic-rtd-02 0.5 float"
  explain: >-
    A name without dashes is positional and required. --threshold is an option,
    written as two words or as --threshold=0.5.
    type=float converts the text "0.5" for you; without it, every value is a str.
  tags: [argparse]

- id: cli-predict-defaults
  type: predict
  topic: cli
  level: 1
  prompt: What does this print?
  code: |
    import argparse
    parser = argparse.ArgumentParser(prog="asrcheck")
    parser.add_argument("trunk")
    parser.add_argument("--threshold", type=float, default=0.65)
    parser.add_argument("--verbose", action="store_true")
    print(parser.parse_args(["ic-ams-01"]))
  answer: "Namespace(trunk='ic-ams-01', threshold=0.65, verbose=False)"
  options:
    - "Namespace(trunk='ic-ams-01', threshold=0.65, verbose=False)"
    - "Namespace(trunk='ic-ams-01')"
    - "Namespace(trunk='ic-ams-01', threshold=None, verbose=None)"
    - "Namespace(trunk='ic-ams-01', threshold='0.65', verbose=True)"
  explain: >-
    Options that aren't given get their default. A store_true flag is False unless it
    appears. The dashes become plain attribute names: args.verbose.
  tags: [argparse, default]

- id: cli-predict-bad-type
  type: predict
  topic: cli
  level: 2
  prompt: What does this print? (argparse also writes an error to stderr.)
  code: |
    import argparse
    parser = argparse.ArgumentParser(prog="asrcheck")
    parser.add_argument("--threshold", type=float)
    try:
        parser.parse_args(["--threshold", "high"])
    except SystemExit as e:
        print("exit code", e.code)
  answer: "exit code 2"
  options:
    - "exit code 2"
    - "exit code 1"
    - "exit code 0"
    - "exit code None"
  explain: >-
    On bad arguments argparse prints the usage and an error, then raises
    SystemExit(2). Exit code 2 is the Unix convention for "used wrongly".
  tags: [argparse, exit-code]

- id: cli-predict-choices
  type: predict
  topic: cli
  level: 2
  prompt: What does this print?
  code: |
    import argparse
    parser = argparse.ArgumentParser(prog="alarm")
    parser.add_argument("--level", choices=["warn", "crit"])
    for value in ["crit", "info"]:
        try:
            print(parser.parse_args(["--level", value]).level)
        except SystemExit as e:
            print("rejected", e.code)
  answer: |-
    crit
    rejected 2
  explain: >-
    choices= lists the only allowed values. Anything else is rejected with exit code 2
    and a message that lists the valid choices.
  tags: [argparse, choices]

- id: cli-predict-subcommands
  type: predict
  topic: cli
  level: 2
  prompt: What does this print?
  code: |
    import argparse
    parser = argparse.ArgumentParser(prog="voicekit")
    sub = parser.add_subparsers(dest="command", required=True)
    report = sub.add_parser("report")
    report.add_argument("--format", default="table")
    check = sub.add_parser("check")
    check.add_argument("trunk")
    args = parser.parse_args(["check", "ic-rtd-02"])
    print(args.command, args.trunk)
  answer: "check ic-rtd-02"
  options:
    - "check ic-rtd-02"
    - "None ic-rtd-02"
    - "report table"
    - "check None"
  explain: >-
    Each subcommand has its own parser and arguments, like git commit and git push.
    dest="command" stores which one was used, so main() can choose what to run.
  tags: [argparse, subcommands]

- id: cli-predict-nagios
  type: predict
  topic: cli
  level: 2
  prompt: What does this print?
  code: |
    NAMES = {0: "OK", 1: "WARNING", 2: "CRITICAL"}

    def status(asr):
        if asr < 0.5:
            return 2
        if asr < 0.8:
            return 1
        return 0

    print([NAMES[status(a)] for a in (0.81, 0.59, 0.4)])
  answer: "['OK', 'WARNING', 'CRITICAL']"
  options:
    - "['OK', 'WARNING', 'CRITICAL']"
    - "['CRITICAL', 'WARNING', 'OK']"
    - "['OK', 'OK', 'WARNING']"
    - "['WARNING', 'WARNING', 'CRITICAL']"
  explain: >-
    Monitoring tools like Nagios and Icinga read the exit code of a check: 0 OK,
    1 WARNING, 2 CRITICAL, 3 UNKNOWN. The script's job is to pick the right number.
  tags: [exit-code, nagios]

- id: cli-mcq-exit-meaning
  type: mcq
  topic: cli
  level: 1
  prompt: A Nagios check script ends with sys.exit(2). What does the monitoring show?
  options:
    - CRITICAL
    - WARNING
    - OK
    - UNKNOWN
  correct: 0
  explain: >-
    0 = OK, 1 = WARNING, 2 = CRITICAL, 3 = UNKNOWN. Outside monitoring, any non-zero
    exit code just means "something went wrong", and shells and CI stop on it.
  tags: [exit-code, nagios]

- id: cli-mcq-parse-args-list
  type: mcq
  topic: cli
  level: 2
  prompt: Why does a test call parser.parse_args(["check", "ic-rtd-02"]) with a list?
  options:
    - The test passes the arguments directly, without touching sys.argv
    - parse_args only accepts lists
    - It makes argparse skip type checks
    - It is faster than the command line
  correct: 0
  explain: >-
    parse_args() with no list reads sys.argv. Writing main(argv=None) and passing argv
    on to parse_args(argv) lets tests call main(["check", "x"]), while the real script
    still uses the command line.
  tags: [argparse, testing]

- id: cli-mcq-subparsers-required
  type: mcq
  topic: cli
  level: 2
  prompt: What does required=True do in add_subparsers(dest="command", required=True)?
  options:
    - Running with no subcommand is an error (exit 2), not command=None
    - Every subcommand must have at least one argument
    - All subcommands run one after another
    - The user must type --command
  correct: 0
  explain: >-
    Without required=True, `voicekit` alone parses fine with command=None, and your
    code has to handle that case. With it, argparse shows the usage and exits with 2.
  tags: [argparse, subcommands]

- id: cli-fill-type-float
  type: fill
  topic: cli
  level: 1
  prompt: Make args.threshold a float.
  code: |
    import argparse
    parser = argparse.ArgumentParser(prog="asrcheck")
    parser.add_argument("--threshold", ____=float, default=0.65)
    args = parser.parse_args(["--threshold", "0.6"])
    print(args.threshold < 0.65)
  blanks:
    - answer: type
      options: [type, cast, kind, convert]
  expected_output: "True"
  explain: >-
    type= can be any function that takes a string: float, int, or your own. If it
    raises ValueError, argparse turns that into a clean usage error.
  tags: [argparse, type]

- id: cli-fill-store-true
  type: fill
  topic: cli
  level: 2
  prompt: Make --verbose an on/off flag.
  code: |
    import argparse
    parser = argparse.ArgumentParser(prog="asrcheck")
    parser.add_argument("--verbose", action="____")
    print(parser.parse_args(["--verbose"]).verbose,
          parser.parse_args([]).verbose)
  blanks:
    - answer: store_true
      options: [store_true, "true", flag, store]
  expected_output: "True False"
  explain: >-
    action="store_true" takes no value: present means True, absent means False. With
    the default action ("store"), --verbose would need a value after it.
  tags: [argparse, flag]

- id: cli-fill-dest
  type: fill
