- id: cli-spotbug-ignored-argv
  type: spot_bug
  topic: cli
  level: 3
  prompt: main(["ic-rtd-02"]) should print the trunk. Tap the line with the bug.
  code: |
    import argparse

    def main(argv=None):
        parser = argparse.ArgumentParser(prog="asrcheck")
        parser.add_argument("trunk")
        args = parser.parse_args()
        print("checking", args.trunk)
        return 0

    main(["ic-rtd-02"])
  bug_line: 6
  fixed_code: |
    import argparse

    def main(argv=None):
        parser = argparse.ArgumentParser(prog="asrcheck")
        parser.add_argument("trunk")
        args = parser.parse_args(argv)
        print("checking", args.trunk)
        return 0

    main(["ic-rtd-02"])
  expected_output: "checking ic-rtd-02"
  explain: >-
    parse_args() with nothing reads sys.argv, which here has no trunk, so argparse
    exits with 2. parse_args(argv) uses the list from the test, and still reads
    sys.argv when argv is None.
  tags: [argparse, testing]

- id: cli-parsons-option
