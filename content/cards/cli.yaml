- id: cli-write-build-parser
  type: write
  topic: cli
  level: 2
  prompt: "Build the parser: positional trunk, --threshold (float, default 0.65), --format (table or json, default table)."
  starter: |
    import argparse

    def build_parser():
        parser = argparse.ArgumentParser(prog="asrcheck")
        parser.add_argument("trunk")
        return parser

    print(build_parser().parse_args(["ic-rtd-02"]))
  tests: |
    a = build_parser().parse_args(["ic-rtd-02"])
    check(lambda: (a.trunk, a.threshold, a.format) == ("ic-rtd-02", 0.65, "table"), "defaults: threshold 0.65, format table")
    b = build_parser().parse_args(["x", "--threshold", "0.5", "--format", "json"])
    check(lambda: b.threshold == 0.5 and b.format == "json", "--threshold 0.5 becomes the float 0.5")
    try:
        build_parser().parse_args(["x", "--format", "csv"])
        code = None
    except SystemExit as e:
        code = e.code
    check(lambda: code == 2, "--format csv must be rejected (exit code 2)")
  hint: >-
    Add parser.add_argument("--threshold", type=float, default=0.65) and
    parser.add_argument("--format", choices=["table", "json"], default="table").
  solution: |
    import argparse

    def build_parser():
        parser = argparse.ArgumentParser(prog="asrcheck")
        parser.add_argument("trunk")
        parser.add_argument("--threshold", type=float,
                            default=0.65)
        parser.add_argument("--format", default="table",
                            choices=["table", "json"])
        return parser

    print(build_parser().parse_args(["ic-rtd-02"]))
  explain: >-
    A build_parser() function lets tests check the parser on its own. type and
    choices move input checks into argparse, which gives users clear errors for free.
  tags: [argparse, choices, type]

- id: cli-write-check-main
  type: write
  topic: cli
  level: 3
  prompt: "main(argv) reads --asr (float, required). Print \"OK\", \"WARNING\" or \"CRITICAL\" with the ASR, and return 0, 1 or 2 (below 0.8 warn, below 0.5 crit)."
  starter: |
    import argparse

    def main(argv=None):
        parser = argparse.ArgumentParser(prog="asrcheck")
        return 3

    code = main(["--asr", "0.59"])
    print("exit code", code)
  tests: |
    import io, contextlib
    def run(argv):
        out = io.StringIO()
        with contextlib.redirect_stdout(out):
            code = main(argv)
        return code, out.getvalue()
    check(lambda: run(["--asr", "0.81"])[0] == 0, "--asr 0.81 returns 0 (OK)")
    check(lambda: run(["--asr", "0.59"])[0] == 1, "--asr 0.59 returns 1 (WARNING)")
    check(lambda: run(["--asr", "0.4"])[0] == 2, "--asr 0.4 returns 2 (CRITICAL)")
    check(lambda: run(["--asr", "0.4"])[1].startswith("CRITICAL"), "the printed line starts with CRITICAL")
    try:
        main([])
        code = None
    except SystemExit as e:
        code = e.code
    check(lambda: code == 2, "--asr is required: main([]) exits with 2")
  hint: >-
    parser.add_argument("--asr", type=float, required=True); args =
    parser.parse_args(argv). Pick code and name with if/elif, print(f"{name} asr=...")
    and return code.
  solution: |
    import argparse

    NAMES = {0: "OK", 1: "WARNING", 2: "CRITICAL"}

    def main(argv=None):
        parser = argparse.ArgumentParser(prog="asrcheck")
        parser.add_argument("--asr", type=float, required=True)
        args = parser.parse_args(argv)
        if args.asr < 0.5:
            code = 2
        elif args.asr < 0.8:
            code = 1
        else:
            code = 0
        print(f"{NAMES[code]} asr={args.asr:.0%}")
        return code

    code = main(["--asr", "0.59"])
    print("exit code", code)
  explain: >-
    This is a complete monitoring check. The real script ends with
    `raise SystemExit(main())`, and Nagios reads the exit code and the first line of
    output.
  tags: [argparse, exit-code, nagios]
