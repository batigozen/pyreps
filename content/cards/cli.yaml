- id: cli-spotbug-string-threshold
  type: spot_bug
  topic: cli
  level: 2
  prompt: This should print "low ASR". Tap the line with the bug.
  code: |
    import argparse
    parser = argparse.ArgumentParser(prog="asrcheck")
    parser.add_argument("--asr")
    args = parser.parse_args(["--asr", "0.4"])
    if args.asr < 0.5:
        print("low ASR")
  bug_line: 3
  fixed_code: |
    import argparse
    parser = argparse.ArgumentParser(prog="asrcheck")
    parser.add_argument("--asr", type=float)
    args = parser.parse_args(["--asr", "0.4"])
    if args.asr < 0.5:
        print("low ASR")
  expected_output: "low ASR"
  explain: >-
    Without type=float, args.asr is the string "0.4", and "0.4" < 0.5 raises
    TypeError. Let argparse convert it, so bad input gets a proper error message.
  tags: [argparse, type]

