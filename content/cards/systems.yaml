- id: systems-spotbug-env-compare
  type: spot_bug
  topic: systems
  level: 2
  prompt: >-
    This should print "retries: 3". Tap the line with the bug.
  code: |
    import os
    retries = os.environ.get("RETRIES", "3")
    if retries > 2:
        print("retries:", retries)
  bug_line: 2
  fixed_code: |
    import os
    retries = int(os.environ.get("RETRIES", "3"))
    if retries > 2:
        print("retries:", retries)
  expected_output: "retries: 3"
  explain: >-
    The value is the string "3", and Python 3 can't compare a str with an int:
    TypeError. Convert once, where you read it.
  tags: [environ, types]

- id: systems-spotbug-linear-backoff
  type: spot_bug
  topic: systems
  level: 2
  prompt: >-
    The waits should double: 1, 2, 4, 8. Tap the line with the bug.
  code: |
    waits = []
    for attempt in range(4):
        waits.append(2 * attempt)
    print(waits)
  bug_line: 3
  fixed_code: |
    waits = []
    for attempt in range(4):
        waits.append(2 ** attempt)
    print(waits)
  expected_output: "[1, 2, 4, 8]"
  explain: >-
    2 * attempt grows by 2 each time (0, 2, 4, 6) and starts at no wait at all.
    2 ** attempt doubles: 1, 2, 4, 8.
  tags: [backoff]

- id: systems-spotbug-prom-string
  type: spot_bug
  topic: systems
  level: 2
  prompt: This should print the trunks with a failure ratio above 0.1. Tap the line with the bug.
  code: |
    import json
    from voicelab import fake_prometheus
    result = json.loads(fake_prometheus("q"))["data"]["result"]
    for r in result:
        if r["value"][1] > 0.1:
            print(r["metric"]["trunk"])
  bug_line: 5
  fixed_code: |
    import json
    from voicelab import fake_prometheus
    result = json.loads(fake_prometheus("q"))["data"]["result"]
    for r in result:
        if float(r["value"][1]) > 0.1:
            print(r["metric"]["trunk"])
  expected_output: "ic-rtd-02"
  explain: >-
    Prometheus sends the value as a string, "0.142", and "0.142" > 0.1 raises
    TypeError. float() first.
  tags: [prometheus, types]

- id: systems-parsons-retry-backoff
  type: parsons
  topic: systems
  level: 2
  prompt: Put the lines in order to retry with backoff until the request works.
  setup: |
    replies = iter([TimeoutError("t1"), TimeoutError("t2"), "200 OK"])

    def fake_get(url, timeout):
        reply = next(replies)
        if isinstance(reply, Exception):
            raise reply
        return reply
  lines:
    - "for attempt in range(4):"
    - "    try:"
    - "        reply = fake_get(\"http://prom:9090\", timeout=5)"
    - "        break"
    - "    except TimeoutError:"
    - "        print(\"retry in\", 2 ** attempt, \"s\")"
    - "print(reply)"
  distractors:
    - "        reply = fake_get(\"http://prom:9090\")"
  expected_output: |-
    retry in 1 s
    retry in 2 s
    200 OK
  explain: >-
    break leaves the loop as soon as a request works. Each timeout prints the next
    wait, doubling each time. On a real machine you'd call time.sleep(2 ** attempt)
    and requests.get(url, timeout=5) here.
  tags: [backoff, timeout]

- id: systems-parsons-not-ready
  type: parsons
  topic: systems
  level: 2
  prompt: Put the lines in order to print the pods that are not ready.
  setup: |
    import json
    from voicelab import fake_kubectl
  lines:
    - "out = fake_kubectl(\"get\", \"pods\", \"-o\", \"json\")"
    - "pods = json.loads(out)[\"items\"]"
    - "for pod in pods:"
    - "    statuses = pod[\"status\"].get(\"containerStatuses\", [])"
    - "    ready = all(c[\"ready\"] for c in statuses)"
    - "    if not statuses or not ready:"
    - "        print(pod[\"metadata\"][\"name\"])"
  distractors:
    - "    if not ready:"
  expected_output: |-
    cdr-exporter-g62q9xtk4r-bjmw2
    kpi-collector-5d8f7c9b4f-2xvkp
  explain: >-
    all() of an empty list is True, so a Pending pod with no containers would look
    ready. Check `not statuses` first. This is the core of a health check.
  tags: [kubectl, json, all]

