- id: systems-write-load-config
  type: write
  topic: systems
  level: 2
  prompt: "Read the config from env: PROM_URL is required (ValueError if missing); TIMEOUT is a float, default 5.0; RETRIES an int, default 3."
  starter: |
    def load_config(env):
        return {"prom_url": env.get("PROM_URL"),
                "timeout": env.get("TIMEOUT"),
                "retries": env.get("RETRIES")}

    print(load_config({"PROM_URL": "http://prom:9090",
                       "TIMEOUT": "2.5"}))
  tests: |
    c = load_config({"PROM_URL": "http://prom:9090", "TIMEOUT": "2.5"})
    check(lambda: c == {"prom_url": "http://prom:9090", "timeout": 2.5, "retries": 3}, "TIMEOUT '2.5' becomes 2.5, RETRIES defaults to 3")
    check(lambda: load_config({"PROM_URL": "u", "RETRIES": "7"})["retries"] == 7, "RETRIES '7' becomes 7")
    check(lambda: load_config({"PROM_URL": "u"})["timeout"] == 5.0, "TIMEOUT defaults to 5.0")
    try:
        load_config({})
        missing = None
    except Exception as e:
        missing = e
    check(lambda: isinstance(missing, ValueError), "a missing PROM_URL raises ValueError")
  hint: >-
    if "PROM_URL" not in env: raise ValueError("PROM_URL is required"). Then
    float(env.get("TIMEOUT", "5")) and int(env.get("RETRIES", "3")).
  solution: |
    def load_config(env):
        if "PROM_URL" not in env:
            raise ValueError("PROM_URL is required")
        return {"prom_url": env["PROM_URL"],
                "timeout": float(env.get("TIMEOUT", "5")),
                "retries": int(env.get("RETRIES", "3"))}

    print(load_config({"PROM_URL": "http://prom:9090",
                       "TIMEOUT": "2.5"}))
  explain: >-
    Passing env in as a dict makes the function easy to test; in the app you'd call
    load_config(os.environ). A missing required value fails at start-up, not halfway
    through a run.
  tags: [environ, config]

- id: systems-write-fetch-retry
  type: write
  topic: systems
  level: 3
  prompt: "Call get(url, timeout=5) up to tries times. On TimeoutError, sleep(1), sleep(2), sleep(4)... and try again. After the last try, raise the error."
  starter: |
    def fetch(get, url, tries=4, sleep=lambda s: None):
        return get(url, timeout=5)

    replies = iter([TimeoutError("slow"), "200 OK"])

    def fake_get(url, timeout):
        reply = next(replies)
        if isinstance(reply, Exception):
            raise reply
        return reply

    print(fetch(fake_get, "http://prom:9090"))
  tests: |
    waits = []
    seq = iter([TimeoutError("a"), TimeoutError("b"), "200 OK"])
    def flaky(url, timeout):
        assert timeout == 5
        r = next(seq)
        if isinstance(r, Exception):
            raise r
        return r
    check(lambda: fetch(flaky, "u", sleep=waits.append) == "200 OK", "the third try gives '200 OK'")
    check(lambda: waits == [1, 2], "it waits 1, then 2 seconds")
    waits2 = []
    def down(url, timeout):
        raise TimeoutError("down")
    try:
        fetch(down, "u", tries=3, sleep=waits2.append)
        raised = False
    except TimeoutError:
        raised = True
    check(lambda: raised, "after the last try the TimeoutError is raised")
    check(lambda: waits2 == [1, 2], "3 tries means 2 waits: 1 and 2 (no wait after the last)")
  hint: >-
    for attempt in range(tries): try: return get(url, timeout=5). except TimeoutError:
    if attempt == tries - 1: raise. Otherwise sleep(2 ** attempt).
  solution: |
    def fetch(get, url, tries=4, sleep=lambda s: None):
        for attempt in range(tries):
            try:
                return get(url, timeout=5)
            except TimeoutError:
                if attempt == tries - 1:
                    raise
                sleep(2 ** attempt)

    replies = iter([TimeoutError("slow"), "200 OK"])

    def fake_get(url, timeout):
        reply = next(replies)
        if isinstance(reply, Exception):
            raise reply
        return reply

    print(fetch(fake_get, "http://prom:9090"))
  explain: >-
    Passing get and sleep in as arguments makes the retry logic testable without a
    network or real waiting. On a real machine: fetch(requests.get, url,
    sleep=time.sleep). A bare `raise` re-raises the current error unchanged.
  tags: [backoff, timeout, retry]
