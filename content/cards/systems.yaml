- id: systems-fill-float-env
  type: fill
  topic: systems
  level: 1
  prompt: Turn ASR_MIN into a number.
  code: |
    import os
    os.environ["ASR_MIN"] = "0.5"
    limit = ____(os.environ.get("ASR_MIN", "0.5"))
    print(limit, 0.59 > limit)
  blanks:
