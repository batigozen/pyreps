# SYSTEMS: env vars, subprocess, kubectl JSON, Prometheus, timeouts and backoff (about 20 cards).
# Offline only: kubectl and Prometheus come from voicelab fakes. subprocess cards are
# tap-only and tagged cpython-only (CONTENT.md rule 10): the app can't start processes.
- id: systems-predict-environ-str
  type: predict
  topic: systems
  level: 1
  prompt: What does this print?
  code: |
    import os
    os.environ["THRESHOLD"] = "0.65"
    value = os.environ.get("THRESHOLD")
    print(type(value).__name__, float(value) * 100)
  answer: "str 65.0"
  options:
    - "str 65.0"
    - "float 65.0"
    - "str 0.650.65"
    - "float 0.65"
  explain: >-
    Environment variables are always strings. Convert them yourself with float() or
    int(), right where you read them.
  tags: [environ]

- id: systems-predict-environ-default
  type: predict
  topic: systems
  level: 1
  prompt: What does this print? (TIMEOUT and API_TOKEN are not set.)
  code: |
    import os
    timeout = int(os.environ.get("TIMEOUT", "5"))
    print(timeout + 1, os.environ.get("API_TOKEN"))
  answer: "6 None"
  explain: >-
    .get(name, default) returns the default when the variable is missing, and None
    without a default. os.environ["API_TOKEN"] would raise KeyError instead.
  tags: [environ, get]

- id: systems-predict-kubectl-phases
  type: predict
  topic: systems
  level: 2
  prompt: What does this print?
  code: |
    import json
    from collections import Counter
    from voicelab import fake_kubectl
    out = fake_kubectl("get", "pods", "-o", "json")
    pods = json.loads(out)["items"]
    print(dict(Counter(p["status"]["phase"] for p in pods)))
  answer: "{'Running': 4, 'Pending': 1}"
  options:
    - "{'Running': 4, 'Pending': 1}"
    - "{'Running': 5}"
    - "{'Running': 3, 'Failed': 1, 'Pending': 1}"
    - "{'Pending': 1, 'Running': 4}"
  explain: >-
    kubectl -o json returns a List with the pods in "items". The cdr-exporter pod is
    still "Running" even though it restarted 6 times: phase alone doesn't show
    health, ready and restartCount do. On a real machine the text comes from
    subprocess.run(["kubectl", ...]).
  tags: [kubectl, json]

- id: systems-predict-prometheus-value
  type: predict
  topic: systems
  level: 2
  prompt: What does this print?
  code: |
    import json
    from voicelab import fake_prometheus
    reply = json.loads(fake_prometheus("sip_failure_ratio"))
    values = {r["metric"]["trunk"]: float(r["value"][1])
              for r in reply["data"]["result"]}
    print(max(values, key=values.get), values["ic-rtd-02"])
  answer: "ic-rtd-02 0.142"
  explain: >-
    Each Prometheus result has a "value" of [timestamp, "string"]. The number is the
    second item, as text, so float() is needed. ic-rtd-02 has the highest failure
    ratio.
  tags: [prometheus, json]

- id: systems-predict-subprocess
  type: predict
  topic: systems
  level: 2
  prompt: What does this print? (This card runs on a real machine, not in the app.)
  code: |
    import subprocess
    r = subprocess.run(["echo", "sbc-ic-01"],
                       capture_output=True, text=True)
    print(repr(r.stdout), r.returncode)
  answer: "'sbc-ic-01\\n' 0"
  options:
    - "'sbc-ic-01\\n' 0"
    - "'sbc-ic-01' 0"
    - "b'sbc-ic-01\\n' 0"
    - "None 0"
  explain: >-
    capture_output=True keeps the output in r.stdout instead of printing it.
    text=True gives a str (without it, bytes). The command's own newline is kept, so
    use .strip(). returncode 0 means success.
  tags: [subprocess, cpython-only]

- id: systems-predict-backoff
  type: predict
  topic: systems
  level: 2
  prompt: What does this print?
  code: |
    delays = [min(2 ** attempt, 30) for attempt in range(6)]
    print(delays, sum(delays))
  answer: "[1, 2, 4, 8, 16, 30] 61"
  options:
    - "[1, 2, 4, 8, 16, 30] 61"
    - "[2, 4, 8, 16, 32, 64] 126"
    - "[0, 2, 4, 6, 8, 10] 30"
    - "[1, 2, 4, 8, 16, 32] 63"
  explain: >-
    Exponential backoff doubles the wait after each failure: 1, 2, 4, 8 seconds...
    A cap (here 30) stops it from growing forever. It gives a struggling server time
    to recover.
  tags: [backoff]

- id: systems-mcq-shell-injection
  type: mcq
  topic: systems
  level: 2
  prompt: pod comes from user input and could be "x; rm -rf ~". Which call is safe?
  options:
    - subprocess.run(["kubectl", "logs", pod])
    - subprocess.run(f"kubectl logs {pod}", shell=True)
    - os.system("kubectl logs " + pod)
    - subprocess.run("kubectl logs " + pod, shell=True, check=True)
  correct: 0
  explain: >-
    With a list, pod is one argument, passed straight to kubectl; no shell reads the
    ";". With shell=True or os.system, the shell runs everything after ";" as a second
    command. That's shell injection.
  tags: [subprocess, security]

- id: systems-mcq-check-true
  type: mcq
  topic: systems
  level: 2
  prompt: What does check=True do in subprocess.run([...], check=True)?
  options:
    - It raises CalledProcessError when the exit code isn't 0
    - It checks that the command exists before running it
    - It prints the exit code
    - It retries the command once
  correct: 0
  explain: >-
    Without check=True a failed command returns quietly with a non-zero returncode, and
    your script carries on with bad data. With it, the failure stops you at the right
    place.
  tags: [subprocess]

- id: systems-mcq-requests-timeout
  type: mcq
  topic: systems
  level: 2
  prompt: Why always call requests.get(url, params=q, timeout=5) with a timeout?
  options:
    - Without it, a server that never answers can hang the script forever
    - The request is faster with a timeout
    - requests needs it to build the URL
    - It retries 5 times by itself
  correct: 0
  explain: >-
    requests has no default timeout. A cron job stuck on one silent server never
    finishes and never alerts. A timeout turns that into a clear error you can retry.
  tags: [requests, timeout]

