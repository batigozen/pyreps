- id: data-spotbug-slowest
  type: spot_bug
  topic: data
  level: 2
  prompt: This should list the 2 longest calls. Tap the line with the bug.
  code: |
    from voicelab import load_cdrs
    rows = load_cdrs()
    by_time = sorted(rows, key=lambda r: int(r["duration_s"]))
    for r in by_time[:2]:
        print(r["call_id"], r["duration_s"])
  bug_line: 3
  fixed_code: |
    from voicelab import load_cdrs
    rows = load_cdrs()
    by_time = sorted(rows, key=lambda r: -int(r["duration_s"]))
    for r in by_time[:2]:
        print(r["call_id"], r["duration_s"])
  expected_output: |-
    c1015 620
    c1047 620
  explain: >-
    sorted() is smallest first, so [:2] took the two shortest calls (0 seconds). A
    negative key (or reverse=True) puts the longest first.
  tags: [sorted, slicing]

- id: data-spotbug-path-plus
  type: spot_bug
  topic: data
  level: 1
  prompt: This should print the file size of the CDR file. Tap the line with the bug.
  code: |
    from pathlib import Path
    folder = Path("data")
    cdrs = folder + "cdrs.csv"
    print(cdrs.stat().st_size > 0)
  bug_line: 3
  fixed_code: |
    from pathlib import Path
    folder = Path("data")
    cdrs = folder / "cdrs.csv"
    print(cdrs.stat().st_size > 0)
  expected_output: "True"
  explain: >-
    Paths join with /, not +: Path + str raises TypeError. With plain strings, +
