# DATA deck: pathlib, csv, json, collections, statistics, sorting records (about 15 cards).
- id: data-predict-path-parts
  type: predict
  topic: data
  level: 1
  prompt: What does this print?
  code: |
    from pathlib import Path
    p = Path("data") / "cdrs.csv"
    print(p, p.suffix, p.stem, p.exists())
  answer: "data/cdrs.csv .csv cdrs True"
  options:
    - "data/cdrs.csv .csv cdrs True"
    - "data/cdrs.csv csv cdrs.csv True"
    - "datacdrs.csv .csv cdrs True"
    - "data/cdrs.csv .csv cdrs False"
  explain: >-
    The / operator joins path parts with the right separator for the OS. .suffix is the
    extension with its dot, .stem the name without it. The sample data folder exists,
    so exists() is True.
  tags: [pathlib]

- id: data-predict-glob
  type: predict
  topic: data
  level: 2
  prompt: What does this print?
  code: |
    from pathlib import Path
    names = sorted(p.name for p in Path("data").glob("*.json"))
    print(names)
  answer: "['pods.json', 'prom.json']"
