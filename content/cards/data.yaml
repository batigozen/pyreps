- id: data-parsons-csv-round-trip
  type: parsons
  topic: data
  level: 2
  prompt: Put the lines in order to write a CSV and read it back.
  setup: |
    import csv, io
    rows = [{"trunk": "ic-ams-01", "asr": 0.59},
            {"trunk": "ic-rtd-02", "asr": 0.4}]
  lines:
    - "buf = io.StringIO()"
    - "writer = csv.DictWriter(buf, fieldnames=[\"trunk\", \"asr\"])"
    - "writer.writeheader()"
    - "writer.writerows(rows)"
    - "back = list(csv.DictReader(io.StringIO(buf.getvalue())))"
    - "print(back[1])"
  distractors:
    - "writer = csv.writer(buf)"
  expected_output: "{'trunk': 'ic-rtd-02', 'asr': '0.4'}"
  explain: >-
    The asr comes back as the string '0.4': CSV keeps no types. That's why JSON is
    often better for data that goes between programs. io.StringIO acts like a file
    in memory, handy for tests.
  tags: [csv]

