- id: data-predict-statistics
  type: predict
  topic: data
  level: 2
  prompt: What does this print?
  code: |
    import statistics
    from voicelab import load_cdrs
    talk = [int(r["duration_s"]) for r in load_cdrs()
            if r["sip_code"] == "200"]
    print(len(talk), round(statistics.mean(talk), 1),
          statistics.median(talk))
  answer: "29 210.1 184"
  options:
    - "29 210.1 184"
    - "48 126.9 140"
    - "29 184 210.1"
    - "29 210 184.0"
  explain: >-
    Only the 29 answered calls are counted. The mean (210.1 s) is above the median
    (184 s) because a few long calls pull it up. For call times the median is often
    the more honest "typical" value.
  tags: [statistics, csv]

- id: data-predict-namedtuple
  type: predict
  topic: data
  level: 1
  prompt: What does this print?
  code: |
    from collections import namedtuple
    Call = namedtuple("Call", "call_id trunk ms")
    c = Call("c1004", "ic-rtd-02", 3087)
    print(c.ms, c[1])
    print(c)
  answer: |-
    3087 ic-rtd-02
    Call(call_id='c1004', trunk='ic-rtd-02', ms=3087)
  explain: >-
    A namedtuple is a tuple with field names: c.ms and c[2] are the same value. It
    can't be changed and has a readable repr. A dataclass is the bigger version with
    methods and defaults.
  tags: [namedtuple]

- id: data-predict-group-quarters
  type: predict
  topic: data
  level: 2
  prompt: What does this print?
  code: |
    from collections import Counter
    from voicelab import load_cdrs
    per_quarter = Counter()
    for row in load_cdrs():
        minute = int(row["start"][14:16])
        per_quarter[f"09:{minute // 15 * 15:02d}"] += 1
    print(sorted(per_quarter.items()))
  answer: "[('09:00', 12), ('09:15', 12), ('09:30', 12), ('09:45', 12)]"
  explain: >-
    minute // 15 * 15 rounds down to 0, 15, 30 or 45, so each call lands in one
    15-minute bucket. Slicing the ISO string works because its format is fixed;
    datetime.fromisoformat is safer for anything more complex.
  tags: [counter, datetime, grouping]

- id: data-mcq-pstdev
  type: mcq
  topic: data
  level: 2
  prompt: When do you use statistics.pstdev instead of statistics.stdev?
  options:
    - When the data is the whole population, like every call of the day
    - When the numbers are percentages
    - When the list is sorted
    - pstdev is the faster version of stdev
  correct: 0
  explain: >-
    pstdev divides by n (all the data you care about). stdev divides by n - 1, for a
    sample that stands for a bigger group. With many values the difference is small.
  tags: [statistics]

- id: data-mcq-json-keys
  type: mcq
  topic: data
  level: 2
  prompt: After a JSON round trip, what is back?
  code: |
    import json
    counts = {200: 29, 503: 4}
    back = json.loads(json.dumps(counts))
  options:
    - "{'200': 29, '503': 4}: the keys became strings"
    - "{200: 29, 503: 4}: the same as before"
    - "[[200, 29], [503, 4]]"
    - "It raises TypeError"
  correct: 0
  explain: >-
    JSON object keys are always strings, so int keys come back as "200". Convert them
    back if needed: {int(k): v for k, v in back.items()}.
  tags: [json]

