- id: data-write-top-n
  type: write
  topic: data
  level: 2
  prompt: Return the n records with the biggest value in field (as int), biggest first.
  starter: |
    from voicelab import load_cdrs
    rows = load_cdrs()

    def top_n(records, n, field):
        return records[:n]

    for r in top_n(rows, 3, "duration_s"):
        print(r["call_id"], r["duration_s"])
  tests: |
    top = top_n(rows, 3, "duration_s")
    check(lambda: [int(r["duration_s"]) for r in top] == [620, 620, 410], "the 3 longest calls are 620, 620 and 410 seconds")
    check(lambda: top_n(rows, 0, "duration_s") == [], "n=0 gives []")
    check(lambda: len(top_n(rows[:2], 5, "duration_s")) == 2, "asking for more than there are gives all of them")
  hint: >-
    sorted(records, key=lambda r: int(r[field]), reverse=True), then slice [:n].
  solution: |
    from voicelab import load_cdrs
    rows = load_cdrs()

    def top_n(records, n, field):
        ordered = sorted(records, key=lambda r: int(r[field]),
                         reverse=True)
        return ordered[:n]

    for r in top_n(rows, 3, "duration_s"):
        print(r["call_id"], r["duration_s"])
  explain: >-
    sorted + slice is the everyday "top N". For very large data, heapq.nlargest(n,
    records, key=...) does it without sorting everything.
  tags: [sorted, slicing]

- id: data-write-summary-json
  type: write
  topic: data
  level: 3
  prompt: "Return a JSON string: {trunk: {\"calls\": n, \"answered\": m}}, with sorted keys."
  starter: |
    import json
    from voicelab import load_cdrs
    rows = load_cdrs()

    def summary_json(rows):
        return "{}"

    print(summary_json(rows)[:60])
  tests: |
    import json as _json
    s = summary_json(rows)
    check(lambda: isinstance(s, str), "return a str (use json.dumps)")
    data = _json.loads(s)
    check(lambda: data["ic-rtd-02"] == {"calls": 15, "answered": 6}, "ic-rtd-02: 15 calls, 6 answered")
    check(lambda: list(data) == sorted(data), "the trunks are in sorted order (sort_keys=True)")
    check(lambda: summary_json([]) == "{}", "no rows gives '{}'")
  hint: >-
    Build a dict with setdefault(trunk, {"calls": 0, "answered": 0}), then return
    json.dumps(result, sort_keys=True).
  solution: |
    import json
    from voicelab import load_cdrs
    rows = load_cdrs()

    def summary_json(rows):
        result = {}
        for row in rows:
            new = {"calls": 0, "answered": 0}
            s = result.setdefault(row["trunk"], new)
            s["calls"] += 1
            s["answered"] += row["sip_code"] == "200"
        return json.dumps(result, sort_keys=True)

    print(summary_json(rows)[:60])
  explain: >-
    sort_keys=True makes the output the same on every run, so two reports can be
    compared with a plain diff, and a hash of the file only changes when the data
    does.
  tags: [json, setdefault]
