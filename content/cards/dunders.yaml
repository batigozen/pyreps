# DUNDERS: which syntax calls which special method (about 20 cards).
- id: dunders-predict-len-str
  type: predict
  topic: dunders
  level: 1
  prompt: What does this print?
  code: |
    class TrunkGroup:
        def __init__(self, names):
            self.names = names

        def __len__(self):
            return len(self.names)

        def __str__(self):
            return f"group of {len(self)}"

    g = TrunkGroup(["ic-ams-01", "ic-rtd-02"])
    print(len(g), g)
  answer: "2 group of 2"
  explain: >-
    len(g) calls g.__len__(), and print(g) calls g.__str__(). You don't call dunder
    methods yourself; the syntax calls them for you.
  tags: [len, str]

- id: dunders-predict-repr-fallback
  type: predict
  topic: dunders
  level: 2
  prompt: What does this print?
  code: |
    class Trunk:
        def __init__(self, name):
            self.name = name

        def __repr__(self):
            return f"Trunk({self.name!r})"

    t = Trunk("ic-ams-01")
    print(t)
    print([t])
  answer: |-
    Trunk('ic-ams-01')
    [Trunk('ic-ams-01')]
  options:
    - "Trunk('ic-ams-01')\n[Trunk('ic-ams-01')]"
    - "Trunk(ic-ams-01)\n[Trunk(ic-ams-01)]"
    - "ic-ams-01\n['ic-ams-01']"
    - "Trunk('ic-ams-01')\n['Trunk']"
  explain: >-
    With no __str__, print uses __repr__. A list always shows its items with repr.
    !r puts quotes around the string, so the repr looks like code you could paste.
  tags: [repr, str]

- id: dunders-predict-eq
  type: predict
  topic: dunders
  level: 2
  prompt: What does this print?
  code: |
    class SipCode:
        def __init__(self, value):
            self.value = value

        def __eq__(self, other):
            return self.value == other.value

    a, b = SipCode(486), SipCode(486)
    print(a == b, a is b)
  answer: "True False"
  options:
    - "True False"
    - "False False"
    - "True True"
    - "False True"
  explain: >-
    == calls __eq__, so it compares the values: True. `is` checks if both names point
    to the same object, and these are two objects. Without __eq__, == would also
    compare identity and give False.
  tags: [eq, is]

- id: dunders-predict-lt-sorted
  type: predict
  topic: dunders
  level: 2
  prompt: What does this print?
  code: |
    class Call:
        def __init__(self, call_id, ms):
            self.call_id = call_id
            self.ms = ms

        def __lt__(self, other):
            return self.ms < other.ms

    calls = [Call("c1004", 3087), Call("c1000", 445),
             Call("c1003", 554)]
    print([c.call_id for c in sorted(calls)])
  answer: "['c1000', 'c1003', 'c1004']"
  explain: >-
    sorted() compares items with <, which calls __lt__. Here a call is "less" when it
    is faster, so the fastest comes first. Without __lt__, sorted would raise
    TypeError.
  tags: [lt, sorted]

- id: dunders-predict-add
  type: predict
  topic: dunders
  level: 2
  prompt: What does this print?
  code: |
    class Stats:
        def __init__(self, calls, ok):
            self.calls, self.ok = calls, ok

        def __add__(self, other):
            return Stats(self.calls + other.calls,
                         self.ok + other.ok)

    ams = Stats(17, 10)
    rtd = Stats(15, 6)
    total = ams + rtd
    print(total.calls, total.ok)
  answer: "32 16"
  explain: >-
    a + b calls a.__add__(b). It returns a new Stats object and leaves ams and rtd as
    they were, like + on numbers.
  tags: [add]

- id: dunders-predict-with-exit
  type: predict
  topic: dunders
  level: 3
  prompt: What does this print?
  code: |
    class Session:
        def __enter__(self):
            print("open")
            return self

        def __exit__(self, exc_type, exc, tb):
            print("close")
            return False

    try:
        with Session():
            raise ValueError("bad reply")
    except ValueError:
        print("caught")
  answer: |-
    open
    close
    caught
  options:
    - "open\nclose\ncaught"
    - "open\ncaught"
    - "open\ncaught\nclose"
    - "open\nclose"
  explain: >-
    __exit__ always runs when the with block ends, also on an error, so "close" comes
    before "caught". Returning False means "don't hide the error", so it reaches the
    except.
  tags: [with, exit]

- id: dunders-mcq-contains
  type: mcq
  topic: dunders
  level: 1
  prompt: Which method does `"ic-ams-01" in group` call?
  options:
    - __contains__
    - __in__
    - __has__
    - __getitem__ only
  correct: 0
  explain: >-
    `in` calls __contains__. If a class has no __contains__, Python falls back to
    looping with __iter__ and comparing each item, which is slower.
  tags: [contains]

- id: dunders-mcq-call
  type: mcq
  topic: dunders
  level: 2
  prompt: check is an object, not a function. What makes check(3087) work?
  code: |
    class SlowCheck:
        def __init__(self, limit):
            self.limit = limit

        def __call__(self, ms):
            return ms > self.limit

    check = SlowCheck(1000)
    check(3087)
  options:
    - __call__
    - __init__
    - __invoke__
    - __run__
  correct: 0
  explain: >-
    obj(...) calls obj.__call__(...). An object with __call__ can be used anywhere a
    function is expected, and it can keep settings like limit.
  tags: [call]

- id: dunders-mcq-exit-true
  type: mcq
  topic: dunders
  level: 3
  prompt: An error happens inside a with block, and __exit__ returns True. What happens?
  options:
    - The error is hidden; the code after the with block runs
    - The error is raised again after __exit__
    - The with block runs again
    - Python prints a warning and stops
  correct: 0
  explain: >-
    A true return value from __exit__ tells Python the error was handled. That's rarely
    what you want. Return False (or None) so errors still reach the caller.
  tags: [with, exit]

