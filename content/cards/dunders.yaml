- id: dunders-fill-iter
  type: fill
  topic: dunders
  level: 2
  prompt: Make a for loop over the group work.
  code: |
    class PodGroup:
        def __init__(self, pods):
            self.pods = pods

        def ____(self):
            return iter(self.pods)

    for pod in PodGroup(["sip-proxy-x2k9p", "call-api-m2xqp"]):
        print(pod)
  blanks:
    - answer: __iter__
      options: [__iter__, __next__, __for__, __loop__]
  expected_output: |-
    sip-proxy-x2k9p
    call-api-m2xqp
