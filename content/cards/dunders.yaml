- id: dunders-write-trunk-group
  type: write
  topic: dunders
  level: 2
  prompt: Give TrunkGroup len(), group[name], `name in group`, and a for loop over the names in sorted order.
  starter: |
    class TrunkGroup:
        def __init__(self, asr):
            self.asr = dict(asr)

    group = TrunkGroup({"ic-rtd-02": 0.4, "ic-ams-01": 0.59})
    print(len(group), group["ic-rtd-02"], list(group))
  tests: |
    g = TrunkGroup({"ic-rtd-02": 0.4, "ic-ams-01": 0.59})
    check(lambda: len(g) == 2, "len(group) is 2")
    check(lambda: g["ic-rtd-02"] == 0.4, "group['ic-rtd-02'] is 0.4")
    check(lambda: "ic-ams-01" in g and "biz-trunk-07" not in g, "`in` checks the names")
    check(lambda: list(g) == ["ic-ams-01", "ic-rtd-02"], "a loop gives the names in sorted order")
  hint: >-
    Add __len__ (len of the dict), __getitem__(self, name), __contains__(self, name)
    and __iter__, which can return iter(sorted(self.asr)).
  solution: |
    class TrunkGroup:
        def __init__(self, asr):
            self.asr = dict(asr)

        def __len__(self):
            return len(self.asr)

        def __getitem__(self, name):
            return self.asr[name]

        def __contains__(self, name):
            return name in self.asr

        def __iter__(self):
            return iter(sorted(self.asr))

    group = TrunkGroup({"ic-rtd-02": 0.4, "ic-ams-01": 0.59})
    print(len(group), group["ic-rtd-02"], list(group))
  explain: >-
    Four small methods make your class behave like a built-in collection, so code
    that uses it can stay plain Python: len(), [], in, for.
  tags: [len, getitem, contains, iter]

- id: dunders-write-maintenance
  type: write
  topic: dunders
  level: 3
  prompt: "Write the Maintenance context manager: ready is False inside the with block, and True again after, even on an error."
  starter: |
    class Maintenance:
        def __init__(self, pod):
            self.pod = pod

    pod = {"name": "call-api-m2xqp", "ready": True}
    with Maintenance(pod):
        print("inside:", pod["ready"])
    print("after:", pod["ready"])
  tests: |
    p = {"name": "x", "ready": True}
    seen = []
    with Maintenance(p):
        seen.append(p["ready"])
    check(lambda: seen == [False] and p["ready"] is True, "ready is False inside and True after")
    try:
        with Maintenance(p):
            raise RuntimeError("restart failed")
    except RuntimeError:
        passed_on = True
    else:
        passed_on = False
    check(lambda: p["ready"] is True, "ready is True again after an error")
    check(lambda: passed_on, "the error must still reach the caller (return False)")
  hint: >-
    __enter__ sets self.pod["ready"] = False and returns self. __exit__(self,
    exc_type, exc, tb) sets it back to True and returns False.
  solution: |
    class Maintenance:
        def __init__(self, pod):
            self.pod = pod

        def __enter__(self):
            self.pod["ready"] = False
            return self

        def __exit__(self, exc_type, exc, tb):
            self.pod["ready"] = True
            return False

    pod = {"name": "call-api-m2xqp", "ready": True}
    with Maintenance(pod):
        print("inside:", pod["ready"])
    print("after:", pod["ready"])
  explain: >-
    with guarantees the clean-up in __exit__, like try/finally. That's how files,
    locks and connections are closed safely. contextlib.contextmanager can write the
    same thing as a generator.
  tags: [with, enter, exit]
