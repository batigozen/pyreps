- id: dunders-spotbug-str-print
  type: spot_bug
  topic: dunders
  level: 1
  prompt: This should print "sbc-ic-01 (2 alarms)". Tap the line with the bug.
  code: |
    class Sbc:
        def __init__(self, name, alarms):
            self.name = name
            self.alarms = alarms

        def __str__(self):
            print(f"{self.name} ({self.alarms} alarms)")

    print(Sbc("sbc-ic-01", 2))
  bug_line: 7
  fixed_code: |
    class Sbc:
        def __init__(self, name, alarms):
            self.name = name
            self.alarms = alarms

        def __str__(self):
            return f"{self.name} ({self.alarms} alarms)"

    print(Sbc("sbc-ic-01", 2))
  expected_output: "sbc-ic-01 (2 alarms)"
  explain: >-
    __str__ must return the text, not print it. Here it returns None, and Python
    raises "TypeError: __str__ returned non-string".
  tags: [str]

- id: dunders-spotbug-lt-field
  type: spot_bug
  topic: dunders
  level: 2
  prompt: Calls should sort from fastest to slowest. Tap the line with the bug.
  code: |
    class Call:
        def __init__(self, call_id, ms):
            self.call_id = call_id
            self.ms = ms

        def __lt__(self, other):
            return self.call_id < other.call_id

    calls = [Call("c1013", 3014), Call("c1003", 554),
             Call("c1009", 403)]
    print([c.ms for c in sorted(calls)])
  bug_line: 7
  fixed_code: |
    class Call:
        def __init__(self, call_id, ms):
            self.call_id = call_id
            self.ms = ms

        def __lt__(self, other):
            return self.ms < other.ms

    calls = [Call("c1013", 3014), Call("c1003", 554),
             Call("c1009", 403)]
    print([c.ms for c in sorted(calls)])
  expected_output: "[403, 554, 3014]"
  explain: >-
    sorted() uses whatever __lt__ compares. Comparing call ids sorts by id. For one
    sort order only, sorted(calls, key=lambda c: c.ms) is often simpler than __lt__.
  tags: [lt, sorted]

- id: dunders-spotbug-exit-hides
  type: spot_bug
  topic: dunders
  level: 3
  prompt: The error should reach the except block. Tap the line with the bug.
  code: |
    class Session:
        def __enter__(self):
            return self

        def __exit__(self, exc_type, exc, tb):
            print("close")
            return True

    try:
        with Session():
            raise TimeoutError("no answer")
        print("all good")
    except TimeoutError:
        print("timeout seen")
  bug_line: 7
  fixed_code: |
    class Session:
        def __enter__(self):
            return self

        def __exit__(self, exc_type, exc, tb):
            print("close")
            return False

    try:
        with Session():
            raise TimeoutError("no answer")
        print("all good")
    except TimeoutError:
        print("timeout seen")
  expected_output: |-
    close
    timeout seen
  explain: >-
    return True from __exit__ hides the error, so the program printed "all good"
    after a timeout. return False lets the error go on to the except block, after
    "close" has run.
  tags: [with, exit]

- id: dunders-parsons-session
  type: parsons
  topic: dunders
  level: 3
  prompt: Put the lines in order so the session closes and the timeout is reported.
  setup: |
    class Session:
        def __init__(self, sbc):
            self.sbc = sbc

        def __enter__(self):
            print("connect", self.sbc)
            return self

        def send(self, method):
            print("send", method)

        def __exit__(self, exc_type, exc, tb):
            print("disconnect")
            return False
  lines:
    - "try:"
    - "    with Session(\"sbc-ic-01\") as s:"
    - "        s.send(\"INVITE\")"
    - "        raise TimeoutError(\"no answer\")"
    - "except TimeoutError as err:"
    - "    print(\"failed:\", err)"
  distractors:
    - "    with Session(\"sbc-ic-01\"):"
  expected_output: |-
    connect sbc-ic-01
    send INVITE
    disconnect
    failed: no answer
  explain: >-
    `as s` gets whatever __enter__ returns, here the session itself. Without `as s`,
    s.send would raise NameError. "disconnect" prints before "failed": __exit__ runs
    first, then the error reaches except.
  tags: [with, enter, exit]

