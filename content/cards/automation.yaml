# AUTOMATION deck: files, cleanup scripts, subprocess, cron, safe writes, logging
# (about 15 cards). subprocess cards are tap-only and tagged cpython-only.
- id: automation-predict-glob-logs
  type: predict
  topic: automation
  level: 2
  prompt: What does this print?
  code: |
    from pathlib import Path
    logs = Path("sbc-logs")
    logs.mkdir(exist_ok=True)
    for name in ["sbc-ic-01.log", "sbc-ic-02.log", "notes.txt"]:
        (logs / name).write_text("x\n")
    print(sorted(p.stem for p in logs.glob("*.log")))
  answer: "['sbc-ic-01', 'sbc-ic-02']"
  options:
    - "['sbc-ic-01', 'sbc-ic-02']"
    - "['sbc-ic-01.log', 'sbc-ic-02.log']"
    - "['notes', 'sbc-ic-01', 'sbc-ic-02']"
    - "['sbc-logs/sbc-ic-01', 'sbc-logs/sbc-ic-02']"
  explain: >-
    glob("*.log") only matches files ending in .log, and .stem drops the extension.
    mkdir(exist_ok=True) doesn't fail when the folder is already there, so the script
    can run every night.
  tags: [pathlib, glob]

- id: automation-predict-rotate
  type: predict
  topic: automation
  level: 2
  prompt: What does this print?
  code: |
    moves = [(f"sbc.log.{i}", f"sbc.log.{i + 1}")
             for i in range(2, 0, -1)]
    print(moves)
  answer: "[('sbc.log.2', 'sbc.log.3'), ('sbc.log.1', 'sbc.log.2')]"
  options:
    - "[('sbc.log.2', 'sbc.log.3'), ('sbc.log.1', 'sbc.log.2')]"
    - "[('sbc.log.1', 'sbc.log.2'), ('sbc.log.2', 'sbc.log.3')]"
    - "[('sbc.log.2', 'sbc.log.3')]"
    - "[('sbc.log.3', 'sbc.log.2'), ('sbc.log.2', 'sbc.log.1')]"
  explain: >-
    Log rotation renames from the oldest end first: .2 to .3, then .1 to .2. Going the
    other way would overwrite .2 before it was moved. range(2, 0, -1) counts down.
  tags: [range, rotation]

- id: automation-predict-check-error
  type: predict
  topic: automation
  level: 2
  prompt: What does this print? (This card runs on a real machine, not in the app.)
  code: |
    import subprocess
    try:
        subprocess.run(["false"], check=True)
        print("all good")
    except subprocess.CalledProcessError as e:
        print("failed with", e.returncode)
  answer: "failed with 1"
  options:
    - "failed with 1"
    - "all good"
    - "failed with 0"
    - "failed with None"
  explain: >-
    `false` is a tiny Unix command that always exits with 1. check=True turns any
    non-zero exit code into CalledProcessError, which carries the code.
  tags: [subprocess, exit-code, cpython-only]

- id: automation-predict-with-closed
  type: predict
  topic: automation
  level: 1
  prompt: What does this print?
  code: |
    from pathlib import Path
    with open("report.txt", "w") as f:
        f.write("ASR 59%\n")
    print(f.closed, Path("report.txt").read_text().strip())
  answer: "True ASR 59%"
  explain: >-
    The with block closes the file when it ends, also on an error, so the data is
    written out. "w" replaces the file; "a" would add to the end.
  tags: [with, files]

- id: automation-predict-stderr-log
  type: predict
  topic: automation
  level: 2
  prompt: What appears on stdout (the normal output)?
  code: |
    import logging
    logging.basicConfig(level=logging.INFO)
    logging.info("deleted 3 old backups")
    print("done")
  answer: "done"
  options:
    - "done"
    - "INFO:root:deleted 3 old backups\ndone"
    - "deleted 3 old backups\ndone"
    - "INFO deleted 3 old backups"
  explain: >-
    logging writes to stderr by default; print writes to stdout. Keeping logs on stderr
    means `script.py > result.txt` or a pipe only gets the real output, while cron
    mail and journald still show the logs.
  tags: [logging, stderr]

- id: automation-mcq-cron-15
  type: mcq
  topic: automation
  level: 1
  prompt: "When does the cron line `*/15 * * * * /opt/voice/asrcheck.py` run?"
  options:
    - Every 15 minutes
    - At minute 15 of every hour
    - Every 15 hours
    - On the 15th of every month
  correct: 0
  explain: >-
    The five fields are minute, hour, day of month, month, day of week. */15 in the
    minute field means 0, 15, 30, 45. `15 * * * *` would be minute 15 only.
  tags: [cron]

- id: automation-mcq-cron-weekly
  type: mcq
  topic: automation
  level: 2
  prompt: "When does `0 3 * * 1 /opt/voice/backup.sh` run?"
  options:
    - At 03:00 every Monday
    - At 00:03 on the 1st of every month
    - Every 3 hours on Mondays
    - At 03:00 on January 1st
  correct: 0
  explain: >-
    Minute 0, hour 3, any day, any month, day of week 1 (Monday; 0 or 7 is Sunday).
    Night-time weekly jobs like backups often look like this.
