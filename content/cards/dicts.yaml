- id: dicts-spotbug-delete-while-looping
  type: spot_bug
  topic: dicts
  level: 3
  prompt: This should remove the codes with a count of 0. Tap the line with the bug.
  code: |
    counts = {"200": 3, "404": 0, "503": 2, "487": 0}
    for code in counts:
        if counts[code] == 0:
            del counts[code]
    print(counts)
  bug_line: 2
  fixed_code: |
    counts = {"200": 3, "404": 0, "503": 2, "487": 0}
    for code in list(counts):
        if counts[code] == 0:
            del counts[code]
    print(counts)
  expected_output: "{'200': 3, '503': 2}"
  explain: >-
    Deleting keys while looping over the same dict raises "RuntimeError: dictionary
    changed size during iteration". list(counts) loops over a copy of the keys, so
    deleting is safe. A comprehension that keeps counts > 0 also works.
  tags: [loop, del]

