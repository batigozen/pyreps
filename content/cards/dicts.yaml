- id: dicts-predict-get-default
  type: predict
  topic: dicts
  level: 1
  prompt: What does this print?
  code: |
    cdr = {"call_id": "c1001", "trunk": "ic-rtd-02",
           "sip_code": "480"}
    print(cdr.get("reason"), cdr.get("reason", "unknown"),
          "sip_code" in cdr)
  answer: None unknown True
  explain: >-
    .get() returns None for a missing key, or the default you pass as the second argument.
    `in` checks keys, and "sip_code" is a key. Neither call adds "reason" to the dict.
  tags: [get, in]

