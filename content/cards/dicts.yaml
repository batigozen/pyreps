- id: dicts-predict-nested-setdefault
  type: predict
  topic: dicts
  level: 2
  prompt: What does this print?
  code: |
    from voicelab import load_cdrs
    stats = {}
    for row in load_cdrs():
        t = row["trunk"]
        s = stats.setdefault(t, {"calls": 0, "ok": 0})
        s["calls"] += 1
        s["ok"] += row["sip_code"] == "200"
    print(stats["ic-rtd-02"])
  answer: "{'calls': 15, 'ok': 6}"
  options:
    - "{'calls': 15, 'ok': 6}"
    - "{'calls': 1, 'ok': 1}"
    - "{'calls': 15, 'ok': 15}"
    - "{'calls': 15, 'ok': True}"
  explain: >-
    setdefault adds the inner dict only the first time a trunk is seen, and always
    returns the dict that is stored, so `s` changes the real stats. True adds as 1,
    so "ok" counts the 6 answered calls out of 15.
  tags: [setdefault, nested]

