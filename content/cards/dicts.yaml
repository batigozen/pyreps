- id: dicts-write-trunk-stats
  type: write
  topic: dicts
  level: 3
  prompt: "Return {trunk: {\"calls\": n, \"answered\": m}} for every trunk."
  starter: |
    from voicelab import load_cdrs
    rows = load_cdrs()

    def trunk_stats(rows):
        # your code here
        return {}

    print(trunk_stats(rows)["ic-rtd-02"])
  tests: |
    s = trunk_stats(rows)
    check(lambda: set(s) == {"ic-ams-01", "ic-rtd-02", "biz-trunk-07"}, "there should be 3 trunks")
    check(lambda: s["ic-rtd-02"] == {"calls": 15, "answered": 6}, "ic-rtd-02: 15 calls, 6 answered")
    check(lambda: sum(v["calls"] for v in s.values()) == 48, "all 48 calls are counted")
    check(lambda: trunk_stats([]) == {}, "no rows should give {}")
  hint: >-
    stats.setdefault(trunk, {"calls": 0, "answered": 0}) gives you the inner dict for
    that trunk. Add 1 to "calls", and add the result of sip_code == "200" to "answered".
  solution: |
    from voicelab import load_cdrs
    rows = load_cdrs()

    def trunk_stats(rows):
        stats = {}
        for row in rows:
            new = {"calls": 0, "answered": 0}
            s = stats.setdefault(row["trunk"], new)
            s["calls"] += 1
            s["answered"] += row["sip_code"] == "200"
        return stats

    print(trunk_stats(rows)["ic-rtd-02"])
  explain: >-
    A nested dict keeps several numbers per trunk. setdefault returns the inner dict
    that is stored, so changing `s` changes stats. This is the shape a KPI report
    builds on.
  tags: [setdefault, nested]
