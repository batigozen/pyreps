- id: dicts-spotbug-get-no-default
  type: spot_bug
  topic: dicts
  level: 1
  prompt: This should count each SIP code. Tap the line with the bug.
  code: |
    codes = ["200", "503", "200"]
    counts = {}
    for code in codes:
        counts[code] = counts.get(code) + 1
    print(counts)
  bug_line: 4
  fixed_code: |
    codes = ["200", "503", "200"]
